<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tournée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Cairo:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ash:#EEEEEE; --ink:#000000; --charcoal:#333333;
  --muted:#595959; --stone:#808080; --line:#D9D9D9; --field:#FFFFFF;
  --metro:#000000; --onmetro:#FFFFFF; --lamp:#7FFEB1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#000000; --ash:#1C1C1C; --ink:#FFFFFF; --charcoal:#D9D9D9;
    --muted:#B3B3B3; --stone:#808080; --line:#333333; --field:#000000;
    --metro:#FFFFFF; --onmetro:#000000;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#000000; --ash:#1C1C1C; --ink:#FFFFFF; --charcoal:#D9D9D9;
  --muted:#B3B3B3; --stone:#808080; --line:#333333; --field:#000000;
  --metro:#FFFFFF; --onmetro:#000000;
}
/* full-bleed inverted band (zine rhythm) */
.band{
  --bg:#000000; --surface:#000000; --ash:#1C1C1C; --ink:#FFFFFF; --charcoal:#D9D9D9;
  --muted:#B3B3B3; --line:#333333; --field:#000000; --metro:#FFFFFF; --onmetro:#000000;
  background:var(--bg); color:var(--ink);
  box-shadow:0 0 0 100vmax var(--bg); clip-path:inset(0 -100vmax);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .band{
    --bg:#FFFFFF; --surface:#FFFFFF; --ash:#EEEEEE; --ink:#000000; --charcoal:#333333;
    --muted:#595959; --line:#D9D9D9; --field:#FFFFFF; --metro:#000000; --onmetro:#FFFFFF;
  }
}
:root[data-theme="dark"] .band{
  --bg:#FFFFFF; --surface:#FFFFFF; --ash:#EEEEEE; --ink:#000000; --charcoal:#333333;
  --muted:#595959; --line:#D9D9D9; --field:#FFFFFF; --metro:#000000; --onmetro:#FFFFFF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Inter","Cairo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.4;letter-spacing:.06em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
header{display:flex;align-items:center;gap:10px;padding:20px 0;border-bottom:1px solid var(--line);margin:0 -20px;padding-left:20px;padding-right:20px}
.brand{font-weight:700;font-size:14px;text-transform:uppercase}
.mark{width:30px;height:30px}
.hero{padding:40px 0 48px}
.hero h1{font-family:"Antonio","Cairo","Arial Narrow",Impact,sans-serif;font-weight:700;text-transform:uppercase;
  font-size:clamp(3.6rem,18vw,6.6rem);line-height:1.15;letter-spacing:0;margin:0 0 24px}
.hero p{color:var(--charcoal);margin:0;max-width:40ch;font-size:18px}
.panel{padding:32px 0;border-top:1px solid var(--line)}
.panel h2{font-size:24px;font-weight:700;margin:0 0 4px;line-height:1.25}
.panel .hint{color:var(--muted);font-size:14px;margin:0 0 20px}
.friend{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.friend:first-of-type{border-top:0;padding-top:0}
.friend-top{display:flex;gap:10px;align-items:center;grid-column:1/-1}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--ink)}
input[type=text],select,input[type=time]{font:inherit;letter-spacing:.06em;color:var(--ink);background:var(--field);border:1px solid var(--line);
  border-radius:20px;padding:10px 16px;width:100%;min-width:0;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.remove{background:none;border:0;color:var(--stone);font:inherit;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:8px;cursor:pointer;flex:none}
.friend-row{grid-column:1/-1;display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.budget label,.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.budget-val{font-weight:700;font-size:14px;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--ink);margin-top:8px}
.check{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.add{margin-top:16px;background:none;border:1px solid var(--ink);color:var(--ink);border-radius:40px;
  padding:12px 22px;font:inherit;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cta{display:block;width:100%;border:0;border-radius:40px;background:var(--ink);color:var(--bg);
  font:inherit;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.06em;padding:18px 22px;cursor:pointer}
.cta:disabled{opacity:.5;cursor:progress}
.note{color:var(--stone);font-size:12px;margin:12px 0 48px;text-align:center}
#result:empty{display:none}
#result{padding:48px 0 56px}
.badge{display:inline-block;background:var(--lamp);color:#000;border-radius:100px;padding:6px 14px;font-size:12px;font-weight:700;text-transform:uppercase;margin-bottom:20px}
.badge.ex{background:var(--ash);color:var(--ink)}
.res-head h2{font-family:"Antonio","Cairo","Arial Narrow",Impact,sans-serif;font-weight:700;text-transform:uppercase;
  font-size:clamp(2.6rem,12vw,5rem);overflow-wrap:anywhere;line-height:1.15;letter-spacing:0;margin:0 0 20px}
.res-head p{margin:0;color:var(--charcoal);font-size:18px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 24px}
.pill{border:1px solid var(--line);border-radius:100px;padding:6px 14px;font-size:14px}
.pill b{font-weight:700}
.compromis{margin:0 0 24px;color:var(--charcoal);font-size:16px}
.map{border-radius:8px;overflow:hidden;margin:0 0 32px;background:var(--ash)}
.map svg{display:block;width:100%;height:auto}
.gmap{width:100%;height:min(60vh,380px)}
.map a{color:var(--ink);font-weight:700;text-transform:uppercase;text-decoration:none}
.map a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.map .cap{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;font-size:12px;color:var(--muted)}
.map button{background:none;border:0;color:var(--ink);font:inherit;font-weight:700;text-transform:uppercase;cursor:pointer;padding:0}
.line{list-style:none;margin:0;padding:0;position:relative}
.line::before{content:"";position:absolute;left:58px;top:12px;bottom:12px;width:4px;background:var(--metro)}
.stop{display:grid;grid-template-columns:44px 30px 1fr;gap:0 12px;padding-bottom:28px;position:relative}
.stop:last-child{padding-bottom:0}
.time{font-weight:700;font-size:14px;padding-top:4px;text-align:right}
.station{width:20px;height:20px;border-radius:50%;background:var(--bg);border:4px solid var(--metro);margin:4px 0 0 8px;position:relative;z-index:1}
.stop.home .station{background:var(--lamp);border-color:var(--lamp)}
.stop-type{font-size:12px;color:var(--muted);margin:0 0 2px}
.stop h3{margin:0;font-size:18px;font-weight:700;line-height:1.25}
.stop .area{color:var(--muted);font-size:14px;margin:2px 0 6px}
.stop .why{margin:0 0 6px;font-size:16px}
.stop .meta{font-size:14px;color:var(--muted)}
.stop .meta b{color:var(--ink);font-weight:700}
.actions{display:flex;gap:8px;margin-top:32px;flex-wrap:wrap}
.btn{flex:1 1 160px;border-radius:40px;padding:14px 22px;font:inherit;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;border:1px solid var(--ink);background:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.thinking{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.train{width:60px;height:4px;background:var(--line);position:relative;overflow:hidden}
.train::after{content:"";position:absolute;inset:0;width:20px;background:var(--ink);animation:ride 1.1s ease-in-out infinite}
@keyframes ride{from{transform:translateX(-20px)}to{transform:translateX(60px)}}
@media (prefers-reduced-motion: reduce){.train::after{animation:none;transform:translateX(20px)}}
.error{background:var(--ash);border-radius:8px;padding:16px}
.view[hidden]{display:none}
:root[data-mode="culture"]{--lamp:#FF9AD5}
body{transition:background .35s,color .35s}
.split{display:grid;grid-template-columns:1fr;width:100vw;margin-left:calc(50% - 50vw)}
.pick{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:calc(50svh - 36px);padding:28px max(20px,calc(50vw - 300px));
  border:0;text-align:left;font:inherit;letter-spacing:.06em;cursor:pointer}
.pick.night{background:#000;color:#fff;--dot:#7FFEB1}
.pick.day{background:#fff;color:#000;--dot:#FF9AD5;border-bottom:1px solid #D9D9D9}
.pick b{font-family:"Antonio","Cairo","Arial Narrow",Impact,sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(3rem,14vw,7rem);line-height:1.15;letter-spacing:0;display:block}
.pick b .last{white-space:nowrap}
.pick b .last::after{content:"";display:inline-block;vertical-align:middle;margin-inline-start:.25em;width:.18em;height:.18em;border-radius:50%;background:var(--dot);transition:transform .25s}
.pick > span{font-size:16px;opacity:.8;max-width:34ch}
.pick:hover b .last::after,.pick:focus-visible b .last::after{transform:scale(1.6)}
.pick:focus-visible{outline:3px solid var(--dot);outline-offset:-6px}
@media (min-width:760px){.split{grid-template-columns:1fr 1fr}.pick{min-height:calc(100svh - 72px);padding:40px}.pick b{font-size:clamp(3.2rem,8vw,6.5rem)}.pick.day{border-bottom:0}}
@media (prefers-reduced-motion: reduce){body,.pick b .last::after{transition:none}}
.city-tag{border:1px solid var(--line);border-radius:100px;padding:4px 12px;font-size:12px;font-weight:700;text-transform:uppercase}
.controls{margin-inline-start:auto;display:flex;align-items:center;gap:16px}
.switch{background:none;border:0;color:var(--ink);font:inherit;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;padding:8px 0}
.switch:focus-visible,.city:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.cities{list-style:none;margin:0 -20px 48px;padding:0;border-top:1px solid var(--line)}
.city{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:14px 20px;border:0;border-bottom:1px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit;letter-spacing:.06em;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.city:hover,.city:focus-visible{background:var(--ink);color:var(--bg)}
.city-name{font-family:"Antonio","Cairo","Arial Narrow",Impact,sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(2rem,10vw,3.8rem);line-height:1.15;letter-spacing:0;min-width:0;overflow-wrap:anywhere}
.city-time{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;white-space:nowrap}
.city-time .night{width:10px;height:10px;border-radius:50%;background:var(--lamp)}
.city-time .day{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;opacity:.5}
@media (prefers-reduced-motion: reduce){.city{transition:none}}
header select.lang{width:auto;padding:6px 30px 6px 12px;font-size:12px;font-weight:700;background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%}
[dir="rtl"] body,[dir="rtl"] input,[dir="rtl"] select,[dir="rtl"] button,[dir="rtl"] .brand,[dir="rtl"] .remove,[dir="rtl"] .add,[dir="rtl"] .cta,[dir="rtl"] .btn,[dir="rtl"] .switch,[dir="rtl"] .pick,[dir="rtl"] .city{letter-spacing:0}
[dir="rtl"] .hero h1,[dir="rtl"] .res-head h2,[dir="rtl"] .city-name,[dir="rtl"] .pick b{line-height:1.45}
[dir="rtl"] .pick,[dir="rtl"] .city{text-align:right}
[dir="rtl"] select{background-position:16px 55%,21px 55%;padding-right:16px;padding-left:36px}
[dir="rtl"] header select.lang{padding:6px 12px 6px 30px;background-position:11px 55%,16px 55%}
[dir="rtl"] .line::before{left:auto;right:58px}
[dir="rtl"] .time{text-align:left}
[dir="rtl"] .station{margin:4px 8px 0 0}
footer{color:var(--stone);font-size:12px;padding:24px 0 40px;border-top:1px solid var(--line)}
#result + footer{border-top:0}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.friend-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="mark" viewBox="0 0 34 34" aria-hidden="true">
      <path d="M5 26 C 12 26, 12 8, 19 8 S 26 20, 29 20" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="5" cy="26" r="4" fill="var(--bg)" stroke="var(--ink)" stroke-width="3"/>
      <circle cx="29" cy="20" r="4.5" fill="var(--ink)"/>
    </svg>
    <span class="brand">Tournée</span>
    <span class="city-tag" id="cityTag" hidden></span>
    <div class="controls">
      <button class="switch" id="switchCity" type="button" hidden></button>
      <select class="lang" id="lang"></select>
    </div>
  </header>

  <main id="landing" class="view">
    <h1 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)" data-i18n="srTitle"></h1>
    <div class="split">
      <button class="pick night" type="button" data-pick="night"><b data-i18n="pickNight"></b><span data-i18n="pickNightSub"></span></button>
      <button class="pick day" type="button" data-pick="culture"><b data-i18n="pickDay"></b><span data-i18n="pickDaySub"></span></button>
    </div>
  </main>

  <main id="home" class="view" hidden>
    <section class="hero">
      <h1 id="homeTitle"></h1>
      <p id="homeText"></p>
    </section>
    <ul class="cities" id="cities"></ul>
  </main>

  <main id="planner" class="view" hidden>
  <section class="hero">
    <h1 data-i18n-html="heroH1"></h1>
    <p id="heroText"></p>
  </section>

  <section class="panel" aria-labelledby="g-title">
    <h2 id="g-title" data-i18n="group"></h2>
    <p class="hint" data-i18n="groupHint"></p>
    <div id="friends"></div>
    <button class="add" id="addFriend" type="button" data-i18n="add"></button>
  </section>

  <section class="panel" aria-labelledby="s-title">
    <h2 id="s-title"></h2>
    <p class="hint" data-i18n="panelHint"></p>
    <div class="grid2">
      <div class="field">
        <label for="area" data-i18n="startLabel"></label>
        <select id="area"></select>
      </div>
      <div class="field">
        <label for="start" data-i18n="timeLabel"></label>
        <input type="time" id="start" value="20:00">
      </div>
    </div>
    <p class="check" style="margin-top:14px"><input type="checkbox" id="metro" checked><label for="metro" id="metroLabel"></label></p>
  </section>

  <button class="cta" id="go" type="button"></button>
  <p class="note" id="status"></p>

  <section id="result" class="band" aria-live="polite"></section>
  </main>

  <footer data-i18n="footer"></footer>
</div>

const LNG0=2.248, LNG1=2.422, LAT0=48.812, LAT1=48.904, W=1000;

const X=lng=>(lng-LNG0)/(LNG1-LNG0)*W, Y=lat=>(LAT1-lat)/(LAT1-LAT0)*H;
const PERIPH=[[2.3595,48.8985],[2.370,48.8985],[2.3855,48.8975],[2.3925,48.888],[2.4065,48.877],[2.4105,48.8635],[2.4105,48.8535],[2.4115,48.847],[2.405,48.835],[2.4005,48.8285],[2.385,48.8275],[2.3695,48.821],[2.3595,48.8195],[2.3255,48.823],[2.305,48.8275],[2.2875,48.8325],[2.2755,48.8385],[2.2705,48.8395],[2.2575,48.8475],[2.2685,48.8605],[2.2765,48.8715],[2.2825,48.878],[2.2925,48.886],[2.3015,48.8905],[2.313,48.8945],[2.329,48.8975],[2.3445,48.8985]];

const CANAL=[[2.3705,48.853],[2.3665,48.8665],[2.3655,48.871],[2.3705,48.879],[2.381,48.8865]];
const HOODS=[["Montmartre",2.3431,48.8867],["Pigalle",2.3375,48.8815],["Batignolles",2.3175,48.8855],["Canal Saint‑Martin",2.3655,48.8725],["Belleville",2.3825,48.8722],["Oberkampf",2.3775,48.8648],["Ménilmontant",2.3895,48.8665],["Le Marais",2.3605,48.8595],["Bastille",2.369,48.8533],["Châtelet",2.347,48.8585],["Quartier Latin",2.347,48.8485],["Saint‑Germain",2.3335,48.8535],["Bercy",2.383,48.8365],["Butte‑aux‑Cailles",2.3505,48.8275],["Tour Eiffel",2.2945,48.8584],["Champs‑Élysées",2.3075,48.8705],["Strasbourg‑Saint‑Denis",2.354,48.8695],["Montparnasse",2.3225,48.842]];
const path=pts=>pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
const inCity=(lat,lng)=>typeof lat==="number"&&typeof lng==="number"&&lat>city.bbox[0]&&lat<city.bbox[1]&&lng>city.bbox[2]&&lng<city.bbox[3];
function fallbackMap(p){ if(city.id==="paris") drawSvgMap(p,true); else { const b=$("#map"); if(b) b.style.display="none"; } }
const inParis=(lat,lng)=>typeof lat==="number"&&typeof lng==="number"&&lat>LAT0&&lat<LAT1&&lng>LNG0&&lng<LNG1;

function drawSvgMap(p, zoom){
  const box=$("#map"); if(!box) return;
  const pts=(p.etapes||[]).filter(s=>inParis(+s.lat,+s.lng)).map((s,i)=>({x:X(+s.lng),y:Y(+s.lat),s,n:i+1}));
  const home=inParis(+p.retour_lat,+p.retour_lng)?{x:X(+p.retour_lng),y:Y(+p.retour_lat)}:null;
  if(!pts.length){ box.style.display="none"; return; }
  let vx=0,vy=0,vw=W,vh=H;
  if(zoom){
    const all=pts.concat(home?[home]:[]);
    const xs=all.map(a=>a.x), ys=all.map(a=>a.y);
    const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
    vw=Math.max(260,(Math.max(...xs)-Math.min(...xs))*1.6, (Math.max(...ys)-Math.min(...ys))*1.6*W/H);
    vh=vw*H/W; vx=Math.min(Math.max(cx-vw/2,0),W-vw); vy=Math.min(Math.max(cy-vh/2,0),H-vh);
  }
  const k=vw/W;
  const route=pts.map((a,i)=>(i?"L":"M")+a.x.toFixed(1)+" "+a.y.toFixed(1)).join(" ")+(home?" L"+home.x.toFixed(1)+" "+home.y.toFixed(1):"");
  const labels=HOODS.map(([n,lng,lat])=>`<text x="${X(lng).toFixed(1)}" y="${Y(lat).toFixed(1)}" text-anchor="middle" font-size="${(vw*0.021).toFixed(1)}" fill="var(--muted)" opacity=".85">${n}</text>`).join("");
  const r=vw*0.026;
  const stops=pts.map(a=>`<g><title>${esc(a.n+". "+a.s.lieu)}</title><circle cx="${a.x}" cy="${a.y}" r="${r}" fill="var(--bg)" stroke="var(--metro)" stroke-width="${r*0.38}"/><text x="${a.x}" y="${a.y}" dy=".35em" text-anchor="middle" font-size="${r*1.05}" font-weight="700" fill="var(--ink)" font-family="Inter,sans-serif">${a.n}</text></g>`).join("");
  const homeMk=home?`<g><title>${esc(t("returnLabel")+" : "+(p.retour_station||""))}</title><rect x="${home.x-r*0.8}" y="${home.y-r*0.8}" width="${r*1.6}" height="${r*1.6}" rx="${r*0.35}" fill="var(--lamp)"/><text x="${home.x}" y="${home.y}" dy=".35em" text-anchor="middle" font-size="${r*1.05}" font-weight="700" fill="#000" font-family="Inter,sans-serif">M</text></g>`:"";
  box.innerHTML=`<svg viewBox="${vx.toFixed(1)} ${vy.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}" role="img" aria-label="${t("mapAria")}">
    <rect x="0" y="0" width="${W}" height="${H}" fill="var(--ash)"/>
    <path d="${path(PERIPH)} Z" fill="var(--bg)" stroke="var(--line)" stroke-width="${3*k}"/>
    <path d="${path(SEINE)}" fill="none" stroke="var(--stone)" stroke-opacity=".45" stroke-width="${16*k}" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path(CANAL)}" fill="none" stroke="var(--stone)" stroke-opacity=".35" stroke-width="${5*k}" stroke-linecap="round" stroke-linejoin="round"/>
    ${labels}
    <path d="${route}" fill="none" stroke="var(--metro)" stroke-width="${(vw*0.011).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round" ${home?"":""}/>
    ${homeMk}${stops}
  </svg>
  <div class="cap"><span>${t("svgCap")}</span><button type="button" id="mapToggle">${zoom?t("svgAll"):t("svgZoom")}</button></div>`;
  $("#mapToggle").onclick=()=>drawSvgMap(p,!zoom);
}

/* Google Maps (falls back to the drawn map if Google can't load) */
let gmPromise=null, gmFailed=false;
window.gm_authFailure=()=>{ gmFailed=true; if(lastPlan) fallbackMap(lastPlan); };
function loadGoogleMaps(){
  if(window.google?.maps?.importLibrary) return Promise.resolve();
  return gmPromise ||= new Promise((res,rej)=>{
    window.__gmReady=res;
    const s=document.createElement("script");
    s.src=`https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&v=weekly&loading=async&language=${lang}&callback=__gmReady`;
    s.async=true; s.onerror=rej; document.head.appendChild(s);
    setTimeout(()=>rej(new Error("timeout")),10000);
  });
}
function mapStyle(dark){
  const c=dark?{geo:"#1c1c1c",road:"#333333",water:"#0a0a0a",txt:"#b3b3b3",halo:"#000000",rail:"#4d4d4d"}
              :{geo:"#f2f2f2",road:"#ffffff",water:"#d6d6d6",txt:"#595959",halo:"#ffffff",rail:"#cccccc"};
  return [
    {elementType:"geometry",stylers:[{color:c.geo}]},
    {elementType:"labels.icon",stylers:[{visibility:"off"}]},
    {elementType:"labels.text.fill",stylers:[{color:c.txt}]},
    {elementType:"labels.text.stroke",stylers:[{color:c.halo}]},
    {featureType:"poi",stylers:[{visibility:"off"}]},
    {featureType:"road",elementType:"geometry",stylers:[{color:c.road}]},
    {featureType:"road.local",elementType:"labels",stylers:[{visibility:"off"}]},
    {featureType:"transit.line",elementType:"geometry",stylers:[{color:c.rail}]},
    {featureType:"transit.station.rail",elementType:"labels.icon",stylers:[{visibility:"on"},{saturation:-100}]},
    {featureType:"water",elementType:"geometry",stylers:[{color:c.water}]}
  ];
}
function directionsUrl(p, pts){
  const ll=s=>`${(+s.lat).toFixed(5)},${(+s.lng).toFixed(5)}`;
  const home=inCity(+p.retour_lat,+p.retour_lng)?{lat:p.retour_lat,lng:p.retour_lng}:null;
  const seq=pts.concat(home?[home]:[]);
  const q=new URLSearchParams({api:"1",origin:ll(seq[0]),destination:ll(seq[seq.length-1]),travelmode:"walking"});
  if(seq.length>2) q.set("waypoints",seq.slice(1,-1).map(ll).join("|"));
  return "https://www.google.com/maps/dir/?"+q.toString();
}
async function drawMap(p){
  const box=$("#map"); if(!box) return;
  const pts=(p.etapes||[]).filter(s=>inCity(+s.lat,+s.lng));
  if(!pts.length){ box.style.display="none"; return; }
  if(!GMAPS_KEY || gmFailed){ fallbackMap(p); return; }
  box.innerHTML=`<div class="gmap" id="gmap" role="region" aria-label="${t("mapAria")}"></div>
    <div class="cap"><span>${t("mapCheck")}</span><a href="${directionsUrl(p,pts)}" target="_blank" rel="noopener">${t("mapOpen")}</a></div>`;
  try{
    await loadGoogleMaps();
    const {Map,Polyline,InfoWindow}=await google.maps.importLibrary("maps");
    const {Marker}=await google.maps.importLibrary("marker");
    const {LatLngBounds}=await google.maps.importLibrary("core");
    if(gmFailed || lastPlan!==p) return;
    const css=getComputedStyle(box), bg=css.getPropertyValue("--bg").trim(), ink=css.getPropertyValue("--ink").trim();
    const dark=bg.toUpperCase()==="#000000";
    const map=new Map($("#gmap"),{styles:mapStyle(dark),disableDefaultUI:true,zoomControl:true,gestureHandling:"cooperative",clickableIcons:false,backgroundColor:bg});
    const info=new InfoWindow(), bounds=new LatLngBounds();
    const route=[];
    pts.forEach((s,i)=>{
      const pos={lat:+s.lat,lng:+s.lng}; route.push(pos); bounds.extend(pos);
      const m=new Marker({map,position:pos,title:`${i+1}. ${s.lieu}`,zIndex:10+i,
        label:{text:String(i+1),color:ink,fontWeight:"700",fontFamily:"Inter, sans-serif",fontSize:"13px"},
        icon:{path:google.maps.SymbolPath.CIRCLE,scale:13,fillColor:bg,fillOpacity:1,strokeColor:ink,strokeWeight:4}});
      m.addListener("click",()=>{ info.setContent(`<div style="font:14px Inter,sans-serif;color:#000"><b>${esc(s.heure)} ${esc(s.lieu)}</b><br>${esc(s.quartier)}</div>`); info.open({map,anchor:m}); });
    });
    if(inCity(+p.retour_lat,+p.retour_lng)){
      const pos={lat:+p.retour_lat,lng:+p.retour_lng}; route.push(pos); bounds.extend(pos);
      new Marker({map,position:pos,title:t("returnLabel")+" : "+(p.retour_station||""),zIndex:5,
        label:{text:"M",color:"#000",fontWeight:"700",fontFamily:"Inter, sans-serif",fontSize:"13px"},
        icon:{path:"M -1 -1 L 1 -1 L 1 1 L -1 1 Z",scale:12,fillColor:getComputedStyle(document.documentElement).getPropertyValue("--lamp").trim()||"#7FFEB1",fillOpacity:1,strokeWeight:0}});
    }
    new Polyline({map,path:route,strokeColor:ink,strokeOpacity:1,strokeWeight:4,zIndex:1});
    if(route.length>1) map.fitBounds(bounds,48); else { map.setCenter(route[0]); map.setZoom(16); }
    google.maps.event.addListenerOnce(map,"idle",()=>{ if(map.getZoom()>17) map.setZoom(17); });
  }catch(e){ gmFailed=true; fallbackMap(p); }
}

async function copyPlan(){
  const p=lastPlan; if(!p) return;
  const txt = `${M().emoji} ${p.titre} (${cityName(city)})\n${p.resume}\n\n` + p.etapes.map(s=>`${s.heure} · ${s.type} : ${s.lieu} (${s.quartier}), ${fmt(s.prix_pp)}`).join("\n") + `\n\n${t("total")} : ${fmt(p.total_pp)} ${t("perPerson")}\n${t("returnLabel")} : ${p.retour}\n\n${t("plannedWith")}`;
  const b=$("#copy");
  try{ await navigator.clipboard.writeText(txt); b.textContent=t("copied"); }
  catch{
    const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
    let ok=false; try{ok=document.execCommand("copy")}catch{} ta.remove();
    b.textContent = ok ? t("copied") : t("copyFail");
  }
  setTimeout(()=>b.textContent=t("copy"),2500);
}

const EXAMPLE = {titre:"Bastille, du canal au dancefloor",resume:"Une soirée qui tient dans 20 € et où chacun trouve son moment.",
  compromis:"Inès garde son budget grâce à un apéro en happy hour, Léa a un vrai dîner et des cocktails sans alcool partout, Yanis finit sur la piste.",

  {heure:"21:15",type:"Dîner",lieu:"Restaurant de street food",quartier:"Rue de la Roquette",pourquoi:"Plats copieux et pas chers, assez de place pour un groupe.",prix_pp:9,trajet:"5 min à pied",lat:48.8566,lng:2.3752},
  {heure:"22:45",type:"Danser",lieu:"Bar dansant entrée libre",quartier:"Bastille",pourquoi:"Pas d'entrée payante, DJ dès 23h.",prix_pp:5,trajet:"4 min à pied",lat:48.8525,lng:2.3705}],
  total_pp:20,retour:"Partir à 0h20 pour le dernier métro ligne 1 à Bastille.",retour_station:"Bastille",retour_lat:48.8531,retour_lng:2.3691};

function showExample(){ renderPlan(EXAMPLE,true); }

const ERR = {rate_limited:"errRate", no_key:"errKey", group:"needTwo"};

async function plan(){
  const go=$("#go"); go.disabled=true;
  $("#result").innerHTML = `<div class="thinking"><span class="train" aria-hidden="true"></span><span>${t("thinking")}</span></div>`;
  ctl?.abort(); ctl = new AbortController();
  try{
    const r = await fetch("/api/plan",{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,
      body:JSON.stringify({lang, mode, city:city.id, friends, area:$("#area").value, start:$("#start").value, metro:$("#metro").checked})});
    const data = await r.json().catch(()=>({}));
    if(!r.ok) throw {code:data.error||"server"};
    const p = data.plan;
    if(!p || !Array.isArray(p.etapes) || !p.etapes.length) throw {code:"bad_shape"};
    renderPlan(p,false);
  }catch(e){
    if(e?.name==="AbortError") return;
    $("#result").innerHTML = `<div class="error"><p style="margin:0 0 12px">${esc(t(ERR[e?.code] || "errGeneric"))}</p>
      <div class="actions" style="margin-top:0"><button class="btn primary" type="button" id="retry">${t("retry")}</button>${city.id==="paris"&&mode==="night"&&lang==="fr"?`<button class="btn" type="button" id="ex">Voir un exemple</button>`:""}</div></div>`;
    $("#retry").onclick=()=>plan(); const ex=$("#ex"); if(ex) ex.onclick=showExample;
  }finally{ go.disabled=false; }
}

$("#go").onclick=()=>{
  if(friends.length<2){ $("#status").textContent=t("needTwo"); return; }
  plan(false);
};
/* Home screen and city routing */
function cityClock(c){
  const parts=new Intl.DateTimeFormat("fr-FR",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:c.tz}).formatToParts(new Date());
  const h=+parts.find(x=>x.type==="hour").value % 24, m=parts.find(x=>x.type==="minute").value;
  return {txt:`${String(h).padStart(2,"0")}:${m}`, night:h>=18||h<5};
}
function renderCities(){
  $("#cities").setAttribute("aria-label",t("citiesLabel"));
  $("#cities").innerHTML=CITIES.map(c=>{const k=cityClock(c);
    return `<li><button class="city" type="button" data-city="${c.id}">
      <span class="city-name">${cityName(c)}</span>
      <span class="city-time" aria-label="${t("clockAria",{t:k.txt,c:cityName(c)})}${k.night?t("evening"):""}"><span class="${k.night?"night":"day"}" aria-hidden="true"></span><bdi>${k.txt}</bdi></span>
    </button></li>`;}).join("");
}
$("#cities").addEventListener("click",e=>{const b=e.target.closest("[data-city]"); if(b) location.hash=mode+"/"+b.dataset.city;});
document.querySelector(".split").addEventListener("click",e=>{const b=e.target.closest("[data-pick]"); if(b) location.hash=b.dataset.pick;});
$("#switchCity").onclick=()=>{ location.hash = $("#planner").hidden ? "" : mode; };

function applyMode(){
  const m=M(), root=document.documentElement;
  root.dataset.theme=m.theme; root.dataset.mode=mode;
  $("#homeTitle").innerHTML=t(m.homeTitle); $("#homeText").textContent=t(m.homeText);
  $("#s-title").textContent=t(m.panel); $("#go").textContent=t(m.cta);
}
function cityTexts(){
  const c=city;
  $("#metroLabel").textContent=t(mode==="culture"?"rideDay":c.ride);
  $("#heroText").textContent=t(M().hero,{c:cityName(c)});
  $("#cityTag").textContent=cityName(c);
  $("#status").textContent=t("status");
}
function openCity(c){
  ctl?.abort(); lastPlan=null;
  city=c; friends=defaultFriends();
  const m=M();
  $("#area").innerHTML=c.areas.map(a=>`<option>${esc(a)}</option>`).join("");
  $("#start").value=mode==="culture"?"14:00":c.start;
  cityTexts();
  $("#result").innerHTML="";
  renderFriends();
}
let opened="";
function route(keepScroll){
  const [m0,c0]=location.hash.slice(1).split("/");
  const c=MODES[m0]?CITIES.find(x=>x.id===c0):null;
  const view=!MODES[m0]?"start":c?"planner":"home";
  if(MODES[m0]){ mode=m0; applyMode(); }
  else { document.documentElement.dataset.theme="light"; delete document.documentElement.dataset.mode; }
  $("#landing").hidden=view!=="start"; $("#home").hidden=view!=="home"; $("#planner").hidden=view!=="planner";
  $("#cityTag").hidden=view!=="planner"; $("#switchCity").hidden=view==="start";
  $("#switchCity").textContent=t(view==="planner"?"switchCity":"switchMode");
  $("#go").hidden=view!=="planner"; $("#status").hidden=view!=="planner";
  document.querySelector("footer").hidden=view==="start";
  if(view==="planner"){ const key=mode+"/"+c.id; if(key!==opened){ openCity(c); opened=key; } document.title="Tournée, "+cityName(c); }
  else if(view==="home"){ renderCities(); document.title="Tournée, "+t(M().label).toLowerCase(); }
  else document.title="Tournée";
  if(keepScroll!==true) window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
setInterval(()=>{ if(!$("#home").hidden) renderCities(); },30000);
/* Language */
function applyLang(){
  const root=document.documentElement;
  root.lang=lang; root.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll(".pick b").forEach(el=>{ const w=el.textContent.split(" "), last=w.pop(); el.innerHTML=(w.length?esc(w.join(" "))+" ":"")+`<span class="last">${esc(last)}</span>`; });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  const sel=$("#lang"); sel.setAttribute("aria-label",t("langLabel"));
  sel.innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}"${k===lang?" selected":""}>${v}</option>`).join("");
}
$("#lang").addEventListener("change",e=>{
  lang=e.target.value; try{localStorage.setItem("tournee-lang",lang)}catch{}
  applyLang(); route(true);
  if(!$("#planner").hidden){ cityTexts(); renderFriends(); if(lastPlan) renderPlan(lastPlan,lastIsExample,true); }
});
applyLang();
route();
</script>
