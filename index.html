<style>
/* Tokens: cream and Voltage Blue. Day = cream page, Night = blue page (the exact inverse). */
:root{
  --cream:#FFF8F1; --blue:#006EFF; --deep:#005CE6;
  --bg:#FFF8F1; --surface:#FFF8F1; --ash:#F4ECE3; --ink:#000000; --charcoal:#1A1A1A;
  --muted:#4D4D4D; --stone:#6B6B6B; --line:#E2E8F0; --field:#FFF8F1;
  --accent:#006EFF; --metro:#006EFF; --onmetro:#FFF8F1;
  --lamp:#7FFEB1; --logodot:#7FFEB1;
  --serif:"Fraunces","Playfair Display",Georgia,serif;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --condensed:"Antonio","Arial Narrow",Impact,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#005CE6; --surface:#005CE6; --ash:#0A52CC; --ink:#FFF8F1; --charcoal:#FFF8F1;
  --muted:#DCE8FC; --stone:#C3D7FA; --line:#4B8BEE; --field:#005CE6;
  --accent:#FFF8F1; --metro:#FFF8F1; --onmetro:#005CE6; --logodot:#FF9AD5;
}
/* result band: the opposite surface of the page it sits on */
.band{
  --bg:#005CE6; --surface:#005CE6; --ash:#0A52CC; --ink:#FFF8F1; --charcoal:#FFF8F1;
  --muted:#DCE8FC; --stone:#C3D7FA; --line:#4B8BEE; --field:#005CE6;
  --accent:#FFF8F1; --metro:#FFF8F1; --onmetro:#005CE6;
  background:var(--bg); color:var(--ink);
  box-shadow:0 0 0 100vmax var(--bg); clip-path:inset(0 -100vmax);
}
:root[data-theme="dark"] .band{
  --bg:#FFF8F1; --surface:#FFF8F1; --ash:#F4ECE3; --ink:#000000; --charcoal:#1A1A1A;
  --muted:#4D4D4D; --stone:#6B6B6B; --line:#E2E8F0; --field:#FFF8F1;
  --accent:#006EFF; --metro:#006EFF; --onmetro:#FFF8F1;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;
  font-size:16px;line-height:1.5;letter-spacing:-.02em;font-feature-settings:"clig","liga";-webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .35s,color .35s}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
.view[hidden]{display:none}

/* header: nav rule bar */
header{display:flex;align-items:center;gap:12px;padding:18px 20px;margin:0 -20px;border-bottom:1.5px solid var(--line)}
.home-link{display:flex;align-items:center;gap:10px;color:var(--accent);text-decoration:none}
.home-link:focus-visible{outline:1.5px solid var(--accent);outline-offset:4px}
.brand{font-weight:400;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.mark{width:28px;height:28px}
.city-tag{border:1.5px solid var(--accent);color:var(--accent);border-radius:60px;padding:3px 12px;font-size:12px;font-weight:300;text-transform:uppercase;letter-spacing:.04em}
.controls{margin-inline-start:auto;display:flex;align-items:center;gap:16px}
.switch{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;font-weight:300;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;padding:8px 0}
header select.lang{width:auto;padding:5px 30px 5px 14px;font-size:12px;font-weight:300;text-transform:uppercase;border-color:var(--accent);color:var(--accent);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%}

/* display type: hairline serif */
.hero{padding:56px 0 56px;text-align:center}
.hero h1{font-family:var(--serif);font-variation-settings:"opsz" 144;font-weight:300;color:var(--accent);
  font-size:clamp(3rem,13vw,6.2rem);line-height:1.02;letter-spacing:-.02em;margin:0 auto 24px;max-width:12ch}
.hero p{color:var(--charcoal);margin:0 auto;max-width:36ch;font-size:18px;font-weight:300}
@media (min-width:600px){.hero h1{font-weight:100}}

.panel{padding:40px 0;border-top:1.5px solid var(--line)}
.panel h2{font-size:28px;font-weight:300;color:var(--accent);margin:0 0 4px;line-height:1.2}
.panel .hint{color:var(--muted);font-size:16px;margin:0 0 24px}
.friend{display:grid;grid-template-columns:1fr auto;gap:14px;padding:20px 0;border-top:1.5px solid var(--line)}
.friend:first-of-type{border-top:0;padding-top:0}
.friend-top{display:flex;gap:10px;align-items:center;grid-column:1/-1}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--accent)}
input[type=text],select{font:inherit;letter-spacing:-.02em;color:var(--ink);background:var(--field);border:1.5px solid var(--line);
  border-radius:60px;padding:11px 18px;width:100%;min-width:0;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);
  background-position:calc(100% - 22px) 55%,calc(100% - 17px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}
.remove{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;font-weight:300;text-transform:uppercase;letter-spacing:.04em;padding:8px;cursor:pointer;flex:none}
.friend-row{grid-column:1/-1;display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.budget label,.field label{display:block;font-size:13px;font-weight:300;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin-bottom:6px}
.budget-val{font-weight:400;font-size:16px;text-transform:none;letter-spacing:-.02em;color:var(--ink);margin-inline-start:6px}
input[type=range]{width:100%;accent-color:var(--accent);margin-top:10px}
.check{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:16px;color:var(--charcoal)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.stops-field{margin-top:20px}
.stops{display:flex;gap:8px;flex-wrap:wrap}
.stops button{min-width:52px;padding:9px 16px;border:1.5px solid var(--line);border-radius:60px;background:transparent;color:var(--ink);font:inherit;font-size:16px;cursor:pointer;transition:background .15s,border-color .15s}
.stops button:hover{border-color:var(--accent)}
.stops button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* outlined pills: the outline is the button */
.add,.cta,.btn{background:transparent;border:1.5px solid var(--accent);color:var(--accent);border-radius:60px;
  font:inherit;font-weight:300;font-size:16px;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;transition:background .15s}
.add{margin-top:20px;padding:12px 30px}
.cta{display:block;width:100%;padding:18px 43px;font-size:18px}
.btn{flex:1 1 180px;padding:14px 30px}
.add:hover,.cta:hover,.btn:hover{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.cta:disabled{opacity:.5;cursor:progress}
.note{color:var(--muted);font-size:14px;margin:14px 0 64px;text-align:center}

/* plan result */
#result:empty{display:none}
#result{padding:64px 0 72px}
.badge{display:inline-block;border:1.5px solid var(--accent);color:var(--accent);border-radius:60px;padding:4px 16px;font-size:13px;font-weight:300;text-transform:uppercase;letter-spacing:.04em;margin-bottom:24px}
.res-head h2{font-family:var(--serif);font-variation-settings:"opsz" 144;font-weight:300;color:var(--accent);
  font-size:clamp(2.6rem,11vw,4.8rem);overflow-wrap:anywhere;line-height:1.02;letter-spacing:-.02em;margin:0 0 20px}
@media (min-width:600px){.res-head h2{font-weight:100}}
.res-head p{margin:0;color:var(--charcoal);font-size:18px;font-weight:300}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 24px}
.pill{border:1.5px solid var(--line);border-radius:60px;padding:5px 16px;font-size:14px}
.pill b{font-weight:400;color:var(--accent)}
.compromis{margin:0 0 32px;color:var(--charcoal);font-size:16px}
.map{overflow:hidden;margin:0 0 40px;border:1.5px solid var(--line)}
.map svg{display:block;width:100%;height:auto}
.gmap{width:100%;height:min(60vh,380px)}
.map a,.map button{color:var(--accent);font:inherit;font-size:13px;font-weight:300;text-transform:uppercase;letter-spacing:.04em;text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.map a:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}
.map .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;font-size:13px;color:var(--muted);border-top:1.5px solid var(--line)}
.line{list-style:none;margin:0;padding:0;position:relative;--tcol:44px}
:root[lang="en"] .line{--tcol:74px}
.line::before{content:"";position:absolute;left:calc(var(--tcol) + 28px);top:12px;bottom:12px;width:3px;background:var(--metro)}
.stop{display:grid;grid-template-columns:var(--tcol) 30px 1fr;gap:0 12px;padding-bottom:32px;position:relative}
.stop:last-child{padding-bottom:0}
.time{font-weight:400;font-size:14px;color:var(--accent);white-space:nowrap;padding-top:4px;text-align:right}
.station{width:20px;height:20px;border-radius:50%;background:var(--bg);border:3px solid var(--metro);margin:4px 0 0 8px;position:relative;z-index:1}
.stop.home .station{background:var(--metro)}
.stop-type{font-size:13px;font-weight:300;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin:0 0 2px}
.stop h3{margin:0;font-family:var(--serif);font-variation-settings:"opsz" 72;font-size:26px;font-weight:300;line-height:1.15;letter-spacing:-.02em}
.stop .area{color:var(--muted);font-size:14px;margin:4px 0 8px}
.stop .why{margin:0 0 8px;font-size:16px}
.stop .meta{font-size:14px;color:var(--muted)}
.stop .meta b{color:var(--ink);font-weight:400}
.actions{display:flex;gap:10px;margin-top:40px;flex-wrap:wrap}
.thinking{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:16px}
.train{width:60px;height:3px;background:var(--line);position:relative;overflow:hidden}
.train::after{content:"";position:absolute;inset:0;width:20px;background:var(--accent);animation:ride 1.1s ease-in-out infinite}
@keyframes ride{from{transform:translateX(-20px)}to{transform:translateX(60px)}}
.error{border:1.5px solid var(--line);padding:20px}

/* landing: two posters side by side */
.split{display:grid;grid-template-columns:1fr;width:100vw;margin-left:calc(50% - 50vw)}
.pick{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;min-height:calc(50svh - 36px);padding:32px max(20px,calc(50vw - 300px));
  border:0;text-align:left;font:inherit;letter-spacing:-.02em;cursor:pointer}
.pick.night{background:#005CE6;color:#FFF8F1;--dot:#FF9AD5}
.pick.day{background:#FFF8F1;color:#006EFF;--dot:#7FFEB1;border-bottom:1.5px solid #E2E8F0}
.pick b{font-family:var(--condensed);font-weight:700;text-transform:uppercase;font-size:clamp(3rem,14vw,7rem);line-height:1.08;letter-spacing:-.02em;display:block}
.pick b .last{white-space:nowrap}
.pick b .last::after{content:"";display:inline-block;vertical-align:middle;margin-inline-start:.25em;width:.16em;height:.16em;border-radius:50%;background:var(--dot);transition:transform .25s}
.pick > span{font-size:18px;font-weight:300;max-width:34ch}
.pick.day > span{color:#000}
.pick:hover b .last::after,.pick:focus-visible b .last::after{transform:scale(1.6)}
.pick:focus-visible{outline:1.5px solid currentColor;outline-offset:-10px}
@media (min-width:760px){.split{grid-template-columns:1fr 1fr}.pick{min-height:calc(100svh - 70px);padding:48px}.pick b{font-size:clamp(3.2rem,8vw,6.5rem)}.pick.day{border-bottom:0}}

/* city list */
.cities{list-style:none;margin:0 -20px 64px;padding:0;border-top:1.5px solid var(--line)}
.city{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:16px 20px;border:0;border-bottom:1.5px solid var(--line);
  background:var(--bg);color:var(--accent);font:inherit;letter-spacing:-.02em;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.city:hover,.city:focus-visible{background:var(--accent);color:var(--bg)}
.city:focus-visible{outline:none}
.city-name{font-family:var(--serif);font-variation-settings:"opsz" 144;font-weight:300;font-size:clamp(2.2rem,10vw,3.6rem);line-height:1.05;letter-spacing:-.02em;min-width:0;overflow-wrap:anywhere}
.city-time{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:300;white-space:nowrap}
.city-time .night{width:9px;height:9px;border-radius:50%;background:currentColor}
.city-time .day{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor}

footer{color:var(--muted);font-size:13px;padding:28px 0 44px;border-top:1.5px solid var(--line);text-align:center}
#result + footer{border-top:0}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.friend-row{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){body,.city,.add,.cta,.btn,.pick b .last::after{transition:none}.train::after{animation:none;transform:translateX(20px)}}
</style>

/* Stylised Paris map, drawn locally (no external tiles) */
const LNG0=2.248, LNG1=2.422, LAT0=48.812, LAT1=48.904, W=1000;
const H=Math.round(W*(LAT1-LAT0)/((LNG1-LNG0)*Math.cos(48.858*Math.PI/180)));
const X=lng=>(lng-LNG0)/(LNG1-LNG0)*W, Y=lat=>(LAT1-lat)/(LAT1-LAT0)*H;
const PERIPH=[[2.3595,48.8985],[2.370,48.8985],[2.3855,48.8975],[2.3925,48.888],[2.4065,48.877],[2.4105,48.8635],[2.4105,48.8535],[2.4115,48.847],[2.405,48.835],[2.4005,48.8285],[2.385,48.8275],[2.3695,48.821],[2.3595,48.8195],[2.3255,48.823],[2.305,48.8275],[2.2875,48.8325],[2.2755,48.8385],[2.2705,48.8395],[2.2575,48.8475],[2.2685,48.8605],[2.2765,48.8715],[2.2825,48.878],[2.2925,48.886],[2.3015,48.8905],[2.313,48.8945],[2.329,48.8975],[2.3445,48.8985]];
const SEINE=[[2.413,48.822],[2.395,48.830],[2.378,48.8395],[2.3685,48.8455],[2.358,48.8505],[2.348,48.8545],[2.341,48.857],[2.335,48.8585],[2.322,48.862],[2.310,48.864],[2.302,48.8635],[2.292,48.8585],[2.284,48.853],[2.275,48.845],[2.268,48.839]];
const CANAL=[[2.3705,48.853],[2.3665,48.8665],[2.3655,48.871],[2.3705,48.879],[2.381,48.8865]];
const HOODS=[["Montmartre",2.3431,48.8867],["Pigalle",2.3375,48.8815],["Batignolles",2.3175,48.8855],["Canal Saint‑Martin",2.3655,48.8725],["Belleville",2.3825,48.8722],["Oberkampf",2.3775,48.8648],["Ménilmontant",2.3895,48.8665],["Le Marais",2.3605,48.8595],["Bastille",2.369,48.8533],["Châtelet",2.347,48.8585],["Quartier Latin",2.347,48.8485],["Saint‑Germain",2.3335,48.8535],["Bercy",2.383,48.8365],["Butte‑aux‑Cailles",2.3505,48.8275],["Tour Eiffel",2.2945,48.8584],["Champs‑Élysées",2.3075,48.8705],["Strasbourg‑Saint‑Denis",2.354,48.8695],["Montparnasse",2.3225,48.842]];
const path=pts=>pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
const inCity=(lat,lng)=>typeof lat==="number"&&typeof lng==="number"&&lat>city.bbox[0]&&lat<city.bbox[1]&&lng>city.bbox[2]&&lng<city.bbox[3];
function fallbackMap(p){ if(city.id==="paris") drawSvgMap(p,true); else { const b=$("#map"); if(b) b.style.display="none"; } }
const inParis=(lat,lng)=>typeof lat==="number"&&typeof lng==="number"&&lat>LAT0&&lat<LAT1&&lng>LNG0&&lng<LNG1;

function drawSvgMap(p, zoom){
  const box=$("#map"); if(!box) return;
  const pts=(p.etapes||[]).filter(s=>inParis(+s.lat,+s.lng)).map((s,i)=>({x:X(+s.lng),y:Y(+s.lat),s,n:i+1}));
  const home=inParis(+p.retour_lat,+p.retour_lng)?{x:X(+p.retour_lng),y:Y(+p.retour_lat)}:null;
  if(!pts.length){ box.style.display="none"; return; }
  let vx=0,vy=0,vw=W,vh=H;
  if(zoom){
    const all=pts.concat(home?[home]:[]);
    const xs=all.map(a=>a.x), ys=all.map(a=>a.y);
    const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
    vw=Math.max(260,(Math.max(...xs)-Math.min(...xs))*1.6, (Math.max(...ys)-Math.min(...ys))*1.6*W/H);
    vh=vw*H/W; vx=Math.min(Math.max(cx-vw/2,0),W-vw); vy=Math.min(Math.max(cy-vh/2,0),H-vh);
  }
  const k=vw/W;
  const route=pts.map((a,i)=>(i?"L":"M")+a.x.toFixed(1)+" "+a.y.toFixed(1)).join(" ")+(home?" L"+home.x.toFixed(1)+" "+home.y.toFixed(1):"");
  const labels=HOODS.map(([n,lng,lat])=>`<text x="${X(lng).toFixed(1)}" y="${Y(lat).toFixed(1)}" text-anchor="middle" font-size="${(vw*0.021).toFixed(1)}" fill="var(--muted)" opacity=".85">${n}</text>`).join("");
  const r=vw*0.026;
  const stops=pts.map(a=>`<g><title>${esc(a.n+". "+a.s.lieu)}</title><circle cx="${a.x}" cy="${a.y}" r="${r}" fill="var(--bg)" stroke="var(--metro)" stroke-width="${r*0.38}"/><text x="${a.x}" y="${a.y}" dy=".35em" text-anchor="middle" font-size="${r*1.05}" font-weight="700" fill="var(--ink)" font-family="Inter,sans-serif">${a.n}</text></g>`).join("");
  const homeMk=home?`<g><title>${esc(t("returnLabel")+" : "+(p.retour_station||""))}</title><rect x="${home.x-r*0.8}" y="${home.y-r*0.8}" width="${r*1.6}" height="${r*1.6}" rx="${r*0.35}" fill="var(--lamp)"/><text x="${home.x}" y="${home.y}" dy=".35em" text-anchor="middle" font-size="${r*1.05}" font-weight="700" fill="#000" font-family="Inter,sans-serif">M</text></g>`:"";
  box.innerHTML=`<svg viewBox="${vx.toFixed(1)} ${vy.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}" role="img" aria-label="${t("mapAria")}">
    <rect x="0" y="0" width="${W}" height="${H}" fill="var(--ash)"/>
    <path d="${path(PERIPH)} Z" fill="var(--bg)" stroke="var(--line)" stroke-width="${3*k}"/>
    <path d="${path(SEINE)}" fill="none" stroke="var(--stone)" stroke-opacity=".45" stroke-width="${16*k}" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path(CANAL)}" fill="none" stroke="var(--stone)" stroke-opacity=".35" stroke-width="${5*k}" stroke-linecap="round" stroke-linejoin="round"/>
    ${labels}
    <path d="${route}" fill="none" stroke="var(--metro)" stroke-width="${(vw*0.011).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round" ${home?"":""}/>
    ${homeMk}${stops}
  </svg>
  <div class="cap"><span>${t("svgCap")}</span><button type="button" id="mapToggle">${zoom?t("svgAll"):t("svgZoom")}</button></div>`;
  $("#mapToggle").onclick=()=>drawSvgMap(p,!zoom);
}

/* Google Maps (falls back to the drawn map if Google can't load) */
let gmPromise=null, gmFailed=false;
window.gm_authFailure=()=>{ gmFailed=true; if(lastPlan) fallbackMap(lastPlan); };
function loadGoogleMaps(){
  if(window.google?.maps?.importLibrary) return Promise.resolve();
  return gmPromise ||= new Promise((res,rej)=>{
    window.__gmReady=res;
    const s=document.createElement("script");
    s.src=`https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&v=weekly&loading=async&language=${lang}&callback=__gmReady`;
    s.async=true; s.onerror=rej; document.head.appendChild(s);
    setTimeout(()=>rej(new Error("timeout")),10000);
  });
}
function mapStyle(dark){
  const c=dark?{geo:"#005CE6",road:"#2F78EC",water:"#0047B8",txt:"#DCE8FC",halo:"#005CE6",rail:"#4B8BEE"}
              :{geo:"#FFF8F1",road:"#FFFFFF",water:"#D6E6FF",txt:"#4D4D4D",halo:"#FFF8F1",rail:"#E2E8F0"};
  return [
    {elementType:"geometry",stylers:[{color:c.geo}]},
    {elementType:"labels.icon",stylers:[{visibility:"off"}]},
    {elementType:"labels.text.fill",stylers:[{color:c.txt}]},
    {elementType:"labels.text.stroke",stylers:[{color:c.halo}]},
    {featureType:"poi",stylers:[{visibility:"off"}]},
    {featureType:"road",elementType:"geometry",stylers:[{color:c.road}]},
    {featureType:"road.local",elementType:"labels",stylers:[{visibility:"off"}]},
    {featureType:"transit.line",elementType:"geometry",stylers:[{color:c.rail}]},
    {featureType:"transit.station.rail",elementType:"labels.icon",stylers:[{visibility:"on"},{saturation:-100}]},
    {featureType:"water",elementType:"geometry",stylers:[{color:c.water}]}
  ];
}
function directionsUrl(p, pts){
  const ll=s=>`${(+s.lat).toFixed(5)},${(+s.lng).toFixed(5)}`;
  const home=inCity(+p.retour_lat,+p.retour_lng)?{lat:p.retour_lat,lng:p.retour_lng}:null;
  const seq=pts.concat(home?[home]:[]);
  const q=new URLSearchParams({api:"1",origin:ll(seq[0]),destination:ll(seq[seq.length-1]),travelmode:"walking"});
  if(seq.length>2) q.set("waypoints",seq.slice(1,-1).map(ll).join("|"));
  return "https://www.google.com/maps/dir/?"+q.toString();
}
async function drawMap(p){
  const box=$("#map"); if(!box) return;
  const pts=(p.etapes||[]).filter(s=>inCity(+s.lat,+s.lng));
  if(!pts.length){ box.style.display="none"; return; }
  if(!GMAPS_KEY || gmFailed){ fallbackMap(p); return; }
  box.innerHTML=`<div class="gmap" id="gmap" role="region" aria-label="${t("mapAria")}"></div>
    <div class="cap"><span>${t("mapCheck")}</span><a href="${directionsUrl(p,pts)}" target="_blank" rel="noopener">${t("mapOpen")}</a></div>`;
  try{
    await loadGoogleMaps();
    const {Map,Polyline,InfoWindow}=await google.maps.importLibrary("maps");
    const {Marker}=await google.maps.importLibrary("marker");
    const {LatLngBounds}=await google.maps.importLibrary("core");
    if(gmFailed || lastPlan!==p) return;
    const css=getComputedStyle(box), bg=css.getPropertyValue("--bg").trim(), ink=css.getPropertyValue("--ink").trim();
    const dark=bg.toUpperCase()==="#005CE6";
    const map=new Map($("#gmap"),{styles:mapStyle(dark),disableDefaultUI:true,zoomControl:true,gestureHandling:"cooperative",clickableIcons:false,backgroundColor:bg});
    const info=new InfoWindow(), bounds=new LatLngBounds();
    const route=[];
    pts.forEach((s,i)=>{
      const pos={lat:+s.lat,lng:+s.lng}; route.push(pos); bounds.extend(pos);
      const m=new Marker({map,position:pos,title:`${i+1}. ${s.lieu}`,zIndex:10+i,
        label:{text:String(i+1),color:ink,fontWeight:"700",fontFamily:"Inter, sans-serif",fontSize:"13px"},
        icon:{path:google.maps.SymbolPath.CIRCLE,scale:13,fillColor:bg,fillOpacity:1,strokeColor:ink,strokeWeight:4}});
      m.addListener("click",()=>{ info.setContent(`<div style="font:14px Inter,sans-serif;color:#000"><b>${esc(fmtTime(s.heure))} ${esc(s.lieu)}</b><br>${esc(s.quartier)}</div>`); info.open({map,anchor:m}); });
    });
    if(inCity(+p.retour_lat,+p.retour_lng)){
      const pos={lat:+p.retour_lat,lng:+p.retour_lng}; route.push(pos); bounds.extend(pos);
      new Marker({map,position:pos,title:t("returnLabel")+" : "+(p.retour_station||""),zIndex:5,
        label:{text:"M",color:"#000",fontWeight:"700",fontFamily:"Inter, sans-serif",fontSize:"13px"},
        icon:{path:"M -1 -1 L 1 -1 L 1 1 L -1 1 Z",scale:12,fillColor:getComputedStyle(document.documentElement).getPropertyValue("--lamp").trim()||"#7FFEB1",fillOpacity:1,strokeWeight:0}});
    }
    new Polyline({map,path:route,strokeColor:ink,strokeOpacity:1,strokeWeight:4,zIndex:1});
    if(route.length>1) map.fitBounds(bounds,48); else { map.setCenter(route[0]); map.setZoom(16); }
    google.maps.event.addListenerOnce(map,"idle",()=>{ if(map.getZoom()>17) map.setZoom(17); });
  }catch(e){ gmFailed=true; fallbackMap(p); }
}

async function copyPlan(){

  const b=$("#copy");

}

function route(keepScroll){

  const view=!MODES[m0]?"start":c?"planner":"home";
  if(MODES[m0]){ mode=m0; applyMode(); }
  else { document.documentElement.dataset.theme="light"; delete document.documentElement.dataset.mode; }
  $("#landing").hidden=view!=="start"; $("#home").hidden=view!=="home"; $("#planner").hidden=view!=="planner";
  $("#cityTag").hidden=view!=="planner"; $("#switchCity").hidden=view==="start";
  $("#switchCity").textContent=t(view==="planner"?"switchCity":"switchMode");
  $("#go").hidden=view!=="planner"; $("#status").hidden=view!=="planner";
  document.querySelector("footer").hidden=view==="start";
  if(view==="planner"){ const key=mode+"/"+c.id; if(key!==opened){ openCity(c); opened=key; } document.title="Tournée, "+cityName(c); }
  else if(view==="home"){ renderCities(); document.title="Tournée, "+t(M().label).toLowerCase(); }
  else document.title="Tournée";
  if(keepScroll!==true) window.scrollTo(0,0);
}
window.addEventListener("popstate",route);
setInterval(()=>{ if(!$("#home").hidden) renderCities(); },30000);
/* Language */
function applyLang(){
  const root=document.documentElement;
  root.lang=lang; root.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll(".pick b").forEach(el=>{ const w=el.textContent.split(" "), last=w.pop(); el.innerHTML=(w.length?esc(w.join(" "))+" ":"")+`<span class="last">${esc(last)}</span>`; });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  const sel=$("#lang"); sel.setAttribute("aria-label",t("langLabel"));
  sel.innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}"${k===lang?" selected":""}>${v}</option>`).join("");
}
$("#homeLink").addEventListener("click",e=>{ e.preventDefault(); go(""); });
$("#lang").addEventListener("change",e=>{
  lang=e.target.value; try{localStorage.setItem("tournee-lang",lang)}catch{}
  const keep=$("#start").value; applyLang(); fillTimes(keep); route(true);
  if(!$("#planner").hidden){ cityTexts(); renderFriends(); if(lastPlan) renderPlan(lastPlan,lastIsExample,true); }
});
applyLang();
route();
</script>
