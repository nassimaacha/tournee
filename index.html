<style>
/* Night = aubergine sky with lavender type. Day = the inverse: lavender light with aubergine type. Gold is jewelry only. */
:root{
  --aub:#271A47; --lav:#DBC9FF; --gold:#BC994E;
  --bg:#DBC9FF; --surface:#DBC9FF; --ash:#CFBBF7; --ink:#271A47; --charcoal:#271A47;
  --muted:#4A3B70; --stone:#5A4B80; --line:#B5A0E6; --field:#DBC9FF;
  --accent:#271A47; --jewel:#271A47; --metro:#271A47; --onmetro:#DBC9FF; --media:#271A47;
  --lamp:#7FFEB1; --logodot:#7FFEB1;
  --serif:"Cormorant Garamond","Playfair Display",Georgia,serif;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#271A47; --surface:#271A47; --ash:#312257; --ink:#DBC9FF; --charcoal:#DBC9FF;
  --muted:#B7A6DE; --stone:#A090C8; --line:#43346C; --field:#271A47;
  --accent:#DBC9FF; --jewel:#BC994E; --metro:#DBC9FF; --onmetro:#271A47; --media:#000000; --logodot:#FF9AD5;
}
.band{
  --bg:#271A47; --surface:#271A47; --ash:#312257; --ink:#DBC9FF; --charcoal:#DBC9FF;
  --muted:#B7A6DE; --stone:#A090C8; --line:#43346C; --field:#271A47;
  --accent:#DBC9FF; --jewel:#BC994E; --metro:#DBC9FF; --onmetro:#271A47; --media:#000000;
  background:var(--bg); color:var(--ink);
  box-shadow:0 0 0 100vmax var(--bg); clip-path:inset(0 -100vmax);
}
:root[data-theme="dark"] .band{
  --bg:#DBC9FF; --surface:#DBC9FF; --ash:#CFBBF7; --ink:#271A47; --charcoal:#271A47;
  --muted:#4A3B70; --stone:#5A4B80; --line:#B5A0E6; --field:#DBC9FF;
  --accent:#271A47; --jewel:#271A47; --metro:#271A47; --onmetro:#DBC9FF; --media:#271A47;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;
  font-size:16px;line-height:1.65;letter-spacing:.036em;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .35s,color .35s}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
[hidden]{display:none !important}

/* labels: Inter 600 uppercase, wide tracking */
.label,.brand,.city-tag,.switch,.remove,.stop-type,.badge,.budget label,.field label,.map a,.map button,.cta,.btn,.add{
  font-family:var(--sans);font-weight:600;text-transform:uppercase;letter-spacing:.111em}

header{display:flex;align-items:center;gap:12px;padding:16px 20px;margin:0 -20px;border-bottom:1px solid var(--line)}
.home-link{display:flex;align-items:center;gap:10px;color:var(--accent);text-decoration:none}
.home-link:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
.brand{font-size:12px}
.mark{width:28px;height:28px}
.city-tag{border:1px solid var(--accent);color:var(--accent);border-radius:30px;padding:3px 12px;font-size:11px}
#homeText:empty{display:none}
#status.err{display:flex;align-items:center;gap:10px;width:fit-content;max-width:100%;margin-inline:auto;padding:10px 16px;border:1.5px solid #BC994E;border-radius:30px;
  background:color-mix(in srgb,#BC994E 16%,transparent);color:var(--ink);font-size:14px;font-weight:600;text-align:left}
#status.err::before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;background:#BC994E;color:#271A47;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion: no-preference){#status.err{animation:st-blink .42s ease-in-out 2}}
@keyframes st-blink{0%,100%{opacity:1}50%{opacity:.12}}
header.noline{border-bottom-color:transparent}
#groupHint,#joinHint,#acctP{display:none!important}
.panel h2{margin-bottom:18px!important}
button.city-tag{background:none;font:inherit;font-size:11px;font-weight:600;letter-spacing:.111em;text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s}
button.city-tag:hover{background:var(--accent);color:var(--bg)}
button.city-tag:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.controls{margin-inline-start:auto;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:6px 14px}
@media (max-width:560px){header .city-tag{display:none}}
.switch{background:none;border:0;color:var(--jewel);font-size:11px;cursor:pointer;padding:8px 0;white-space:nowrap}
header select.lang{width:auto;padding:4px 30px 4px 14px;font-size:12px;font-weight:600;letter-spacing:.111em;border:1px solid var(--accent);color:var(--accent);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%}

/* display: Garamond-class serif */
.hero{padding:56px 0 56px}
.hero h1{font-family:var(--serif);font-weight:400;color:var(--accent);
  font-size:clamp(3.2rem,15vw,6.4rem);line-height:1.02;letter-spacing:0;margin:0 0 24px}
.hero h1{text-wrap:balance}
#planner .hero h1{font-size:clamp(2.2rem,11.5vw,5rem)}
.hero h1 .ln{display:block;white-space:nowrap}
.hero p{color:var(--charcoal);margin:0;max-width:38ch;font-size:16px}

.panel{padding:40px 0;border-top:1px solid var(--line)}
.panel h2{font-family:var(--serif);font-size:42px;font-weight:400;color:var(--accent);margin:0 0 10px;line-height:1.1;letter-spacing:0}
.panel .hint{color:var(--muted);font-size:14px;margin:0 0 24px}
.friend{display:grid;grid-template-columns:1fr auto;gap:12px;padding:20px 0;border-top:1px solid var(--line)}
.friend:first-of-type{border-top:0;padding-top:0}
.friend-top{display:flex;gap:10px;align-items:center;grid-column:1/-1}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--jewel)}
input[type=text],input[type=date],select{font:inherit;letter-spacing:.036em;color:var(--ink);background:var(--field);border:1px solid var(--line);
  border-radius:30px;padding:10px 18px;width:100%;min-width:0;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);
  background-position:calc(100% - 22px) 55%,calc(100% - 17px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.remove{background:none;border:0;color:var(--jewel);font-size:11px;padding:8px;cursor:pointer;flex:none}
.friend-row{grid-column:1/-1;display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.budget label,.field label{display:block;font-size:11px;color:var(--accent);margin-bottom:6px}
.budget-val{font-weight:400;font-size:14px;text-transform:none;letter-spacing:.036em;color:var(--ink);margin-inline-start:6px}
input[type=range]{width:100%;accent-color:var(--accent);margin-top:10px}
.check{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--charcoal)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stops-field{margin-top:20px}
.stops{display:flex;gap:8px;flex-wrap:wrap}
.stops button{min-width:48px;padding:8px 16px;border:1px solid var(--line);border-radius:30px;background:transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.stops button:hover{border-color:var(--accent)}
.stops button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--bg)}

/* ghost pill buttons, fill on hover */
.add,.cta,.btn{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:30px;font-size:13px;cursor:pointer;transition:background .15s,color .15s}
.add{margin-top:20px;padding:12px 20px}
.cta{display:block;width:100%;padding:18px 20px;font-size:14px}
.btn{flex:1 1 180px;padding:12px 20px}
.cta::after,.btn.primary::after{content:" →"}
.add:hover,.cta:hover,.btn:hover{background:var(--accent);color:var(--bg)}
.cta:disabled{opacity:.5;cursor:progress}
.note{color:var(--muted);font-size:13px;margin:14px 0 64px;text-align:center}

/* result */
#result:empty{display:none}
#result{padding:64px 0 72px}
.badge{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:30px;padding:4px 14px;font-size:11px;margin-bottom:24px}
.res-head h2{font-family:var(--serif);font-weight:400;color:var(--accent);
  font-size:clamp(2.8rem,12vw,5rem);overflow-wrap:anywhere;line-height:1.02;letter-spacing:0;margin:0 0 18px}
.res-head p{margin:0;color:var(--charcoal);font-size:16px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}
.pill{border:1px solid var(--line);border-radius:30px;padding:4px 14px;font-size:13px}
.pill b{font-weight:600;color:var(--jewel)}
.compromis{margin:0 0 32px;color:var(--charcoal);font-size:15px}
.map{overflow:hidden;margin:0 0 40px;border-radius:10px;background:var(--media);color:#DBC9FF}
.map svg{display:block;width:100%;height:auto}
.gmap{width:100%;height:min(60vh,380px)}
.map a,.map button{white-space:nowrap;color:var(--jewel);font-size:11px;text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.band .map a,.band .map button{color:#BC994E}
.map a:focus-visible{outline:1px solid currentColor;outline-offset:3px}
.map .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;font-size:12px;color:#B7A6DE}
.line{list-style:none;margin:0;padding:0;position:relative;--tcol:44px}
:root[lang="en"] .line{--tcol:74px}
.line.notimes .time{display:none}
.line.notimes .stop{grid-template-columns:30px 1fr}
.line.notimes::before{left:15px}
.line::before{content:"";position:absolute;left:calc(var(--tcol) + 28px);top:12px;bottom:12px;width:2px;background:var(--metro)}
.stop{display:grid;grid-template-columns:var(--tcol) 30px 1fr;gap:0 12px;padding-bottom:32px;position:relative}
.stop:last-child{padding-bottom:0}
.time{font-weight:600;font-size:13px;letter-spacing:.111em;color:var(--jewel);white-space:nowrap;padding-top:4px;text-align:right}
.station{width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--metro);margin:4px 0 0 7px;position:relative;z-index:1}
.stop.home .station{background:var(--jewel);border-color:var(--jewel)}
.stop-type{font-size:11px;color:var(--accent);margin:0 0 2px}
.stop h3{margin:0;font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.1;letter-spacing:0}
.stop .area{color:var(--muted);font-size:13px;margin:4px 0 8px}
.stop h3 + .why,.stop h3 + .area{margin-top:6px}
.stop .why{margin:0 0 8px;font-size:15px}
.stop .meta{font-size:13px;color:var(--muted)}
.stop .meta b{color:var(--ink);font-weight:600}
.actions{display:flex;gap:10px;margin-top:40px;flex-wrap:wrap}
.thinking{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.train{width:60px;height:2px;background:var(--line);position:relative;overflow:hidden}
.train::after{content:"";position:absolute;inset:0;width:20px;background:var(--jewel);animation:ride 1.1s ease-in-out infinite}
@keyframes ride{from{transform:translateX(-20px)}to{transform:translateX(60px)}}
.error{border:1px solid var(--line);border-radius:10px;padding:20px}

/* landing: night sky and its inverse */
.split{display:grid;grid-template-columns:1fr;width:100vw;margin-left:calc(50% - 50vw)}
.pick{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:calc(50svh - 36px);padding:32px max(20px,calc(50vw - 300px));
  border:0;text-align:left;font:inherit;cursor:pointer}
.pick.night{background:#271A47;color:#DBC9FF;--dot:#FF9AD5}
.pick.day{background:#DBC9FF;color:#271A47;--dot:#7FFEB1}
.pick b{font-family:var(--serif);font-weight:400;font-size:clamp(3.4rem,16vw,7.5rem);line-height:1;letter-spacing:0;display:block}
.pick b .last{white-space:nowrap}
@media (max-width:759px){.pick.day{order:-1}}
.pick b .last::after{content:"";display:inline-block;vertical-align:middle;margin-inline-start:.22em;width:.14em;height:.14em;border-radius:50%;background:var(--dot);transition:transform .25s}
.pick > span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.111em;max-width:40ch;line-height:1.7}
.pick.night > span{color:#BC994E}
.pick:focus-visible{outline:1px solid currentColor;outline-offset:-10px}
@media (min-width:760px){.split{grid-template-columns:1fr 1fr}.pick{min-height:calc(100svh - 62px);padding:48px}.pick b{font-size:clamp(3.4rem,8.5vw,7.5rem)}}

/* city list: journal rows */
/* home: hero in the top third, continents + cities fill the rest, no rules */
#home .hero{min-height:28svh;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 0 18px}
#home .hero h1{font-size:clamp(2.4rem,10vw,4.4rem);margin:0 0 12px}
#home .hero p{font-size:15px}
.world{--rows:11;--rowh:max(44px,calc((100svh - 28svh - 62px - 64px) / var(--rows)));padding-bottom:24px}
.conts{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 8px;padding:4px 20px 8px}
.conts::-webkit-scrollbar{display:none}
.cont{flex:none;background:none;border:0;border-radius:30px;padding:7px 14px;color:var(--muted);font:inherit;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.111em;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.cont:hover{color:var(--accent)}
.cont[aria-selected="true"]{background:var(--accent);color:var(--bg)}
.cont:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.cities{list-style:none;margin:0 -20px;padding:0;height:calc(var(--rowh) * var(--rows))}
.city{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:var(--rowh);padding:0 20px;border:0;
  background:transparent;color:var(--accent);font:inherit;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.city:hover,.city:focus-visible{background:var(--accent);color:var(--bg)}
.city:focus-visible{outline:none}
.city-name{font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,min(7.5vw,calc(var(--rowh) * .62)),3rem);line-height:1.05;letter-spacing:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.city-time{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.111em;white-space:nowrap}
.city-time .night{width:7px;height:7px;border-radius:50%;background:var(--jewel)}
.city:hover .city-time .night,.city:focus-visible .city-time .night{background:currentColor}
.city-time .day{width:7px;height:7px;border-radius:50%;border:1px solid currentColor}

[hidden]{display:none!important}
.friend-row{grid-template-columns:1fr!important}
.blabel{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.111em;color:var(--accent);margin-bottom:8px}

.cur[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.friend-top{flex-wrap:wrap}

}

.reviews h2{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,8vw,3.4rem);color:var(--accent);margin:0 0 22px;line-height:1.05}
.rv-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 6px;scrollbar-width:thin}
.rv-card{flex:0 0 min(300px,80vw);scroll-snap-align:start;border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.rv-card .st{color:var(--jewel);font-size:15px;letter-spacing:2px}
.rv-card p{margin:0;font-family:var(--serif);font-size:21px;line-height:1.3}
.rv-card .who{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.111em;color:var(--muted)}
.legal{max-width:62ch;padding-bottom:48px}
.legal h2{font-family:var(--serif);font-weight:400;font-size:30px;color:var(--accent);margin:32px 0 8px}
.legal p{margin:0 0 12px;font-size:15px}
.foot-links{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px}
.review-link{background:none;border:0;padding:0;font:inherit;cursor:pointer}
.review-link:hover,.footer-link:hover{color:var(--accent)}
.footer-link{color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px;width:100%}
.partner-note{font-size:11px;opacity:.8}
footer{color:var(--muted);font-size:12px;padding:28px 0 44px;border-top:1px solid var(--line)}
#result + footer{border-top:0}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.friend-row{grid-template-columns:1fr}}

/* ===== motion (all of it switches off with prefers-reduced-motion) ===== */
@media (prefers-reduced-motion: no-preference){
/* 1. logo draws itself */
.mark.draw path{stroke-dasharray:60;stroke-dashoffset:60;animation:mk-draw 1s ease-out .15s forwards}
.mark.draw circle:nth-of-type(1){transform-box:fill-box;transform-origin:center;transform:scale(0);animation:mk-pop .3s ease-out .1s forwards}
.mark.draw circle:nth-of-type(2){transform-box:fill-box;transform-origin:center;transform:scale(0);animation:mk-pop .45s cubic-bezier(.3,1.6,.6,1) 1.05s forwards}
/* 3. budget circle pop */
.lvl.pop{animation:mk-bump .35s cubic-bezier(.3,1.6,.6,1)}
/* 4. plan unfolds */
.line.reveal::before{transform-origin:top;transform:scaleY(0);animation:mk-grow calc(var(--n,3) * .35s + .3s) ease-out forwards}
.line.reveal .stop{opacity:0;transform:translateY(12px);animation:mk-up .45s ease-out forwards;animation-delay:calc(var(--i,0) * .35s + .15s)}
.res-head.reveal > *{opacity:0;transform:translateY(10px);animation:mk-up .5s ease-out forwards}
.res-head.reveal > *:nth-child(2){animation-delay:.08s}.res-head.reveal > *:nth-child(3){animation-delay:.16s}
/* 6. homepage halves breathe (desktop) */
@media (min-width:760px){
.split{display:flex}
.pick{flex:1 1 0;transition:flex-grow .6s cubic-bezier(.2,.8,.2,1)}
.split:hover .pick{flex-grow:.85}
.split .pick:hover,.split .pick:focus-visible{flex-grow:1.3}
}
.pick:hover b .last::after,.pick:focus-visible b .last::after{animation:mk-pulse 1.4s ease-in-out infinite}
/* 7. cities slide in */
.cities.in li{opacity:0;transform:translateY(14px);animation:mk-up .45s ease-out forwards;animation-delay:calc(var(--i,0) * .05s)}
/* 9. night sky */
#sky span{animation:mk-twinkle var(--d,4s) ease-in-out var(--w,0s) infinite}
}
#sky{position:fixed;inset:0;pointer-events:none;z-index:-1;display:none}
:root[data-theme="dark"] #sky.on{display:block}
#sky span{position:absolute;width:2px;height:2px;border-radius:50%;background:#DBC9FF;opacity:.25}
/* 2. loading route */
.thinking{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:14px}
.thinking .route{flex:none}
.thinking .route .rt{stroke:var(--line)}
.thinking .route .a{fill:var(--bg);stroke:var(--accent)}
.thinking .route .c{fill:var(--logodot,#FF9AD5)}
.thinking .route .mover{fill:var(--accent)}
/* 5. night/day color wipe */
.wipe{position:fixed;inset:0;z-index:50;pointer-events:none;clip-path:circle(0 at var(--x) var(--y));transition:clip-path .55s cubic-bezier(.6,0,.2,1),opacity .3s ease}
.wipe.open{clip-path:circle(150% at var(--x) var(--y))}
.wipe.done{opacity:0}
/* 8. map pins (drawn map) */
@media (prefers-reduced-motion: no-preference){
.map svg .pin{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:mk-pop .4s cubic-bezier(.3,1.6,.6,1) forwards;animation-delay:calc(var(--i,0) * .25s + .2s)}
.map svg .rline{stroke-dasharray:2000;stroke-dashoffset:2000;animation:mk-draw 1.4s ease-out .2s forwards}
}
@keyframes mk-draw{to{stroke-dashoffset:0}}
@keyframes mk-pop{to{transform:scale(1)}}
@keyframes mk-bump{0%{transform:scale(.82)}100%{transform:scale(1)}}
@keyframes mk-grow{to{transform:scaleY(1)}}
@keyframes mk-up{to{opacity:1;transform:none}}
@keyframes mk-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.7)}}
@keyframes mk-twinkle{0%,100%{opacity:.12}50%{opacity:.7}}
@media (prefers-reduced-motion: reduce){body,.city,.add,.cta,.btn,.stops button,.pick b .last::after{transition:none}.train::after{animation:none;transform:translateX(20px)}}
</style>

  return `${String(h).padStart(2,"0")}:${mm}`;
}

// budget circles: euros stay 5/20/50/100/150, dollars start at 5 and end in 0 or 5, every other currency ends in 0
function roundy(v){
  const e=Math.pow(10,Math.floor(Math.log10(v)));
  let best=e; for(const m of [1,1.5,2,2.5,3,4,5,6,7,8,9,10]){ if(Math.abs(m*e-v)<Math.abs(best-v)) best=m*e; }
  if(Math.round(best/e)===9) best=10*e;   // 90 reads better as 100
  return Math.round(best);
}
// budget circles: euros stay 5/20/50/100/150; everything else is one digit followed by zeros (or 15/25 style), dollars start at 5, others at 10 minimum
// budget circles per currency: only 5, 10, 20, 25, 50, 75, 100, 150, 250, 500 (with extra zeros for big currencies)
const BUDGETS={EUR:[5,20,50,100,150],USD:[5,25,50,100,150],GBP:[5,20,50,75,150],CAD:[10,25,75,150,250],MXN:[100,500,1000,2000,2500],
  BRL:[25,150,250,750,1000],JPY:[1000,2500,7500,15000,25000],KRW:[10000,25000,75000,150000,250000],THB:[200,750,2000,5000,7500],
  SGD:[10,25,75,150,200],SAR:[20,50,100,250,500],CZK:[100,500,1000,2500,5000],TRY:[250,1000,2500,5000,7500],AED:[20,50,100,250,500],MAD:[50,200,500,1000,1500],EGP:[250,1000,2500,5000,7500],
  ZAR:[100,500,1000,2000,2500],AUD:[10,25,100,200,250]};
function budgetIn(j,code){

}

function money(localAmount){
  const n=Number(localAmount); if(!Number.isFinite(n)) return String(localAmount??"");
  const code=dispCode(); if(code===localCode()) return fmt(n);

}

const inParis=(lat,lng)=>typeof lat==="number"&&typeof lng==="number"&&lat>LAT0&&lat<LAT1&&lng>LNG0&&lng<LNG1;

function drawSvgMap(p, zoom){
  const box=$("#map"); if(!box) return;

    const all=pts.concat(home?[home]:[]);

    const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
    vw=Math.max(260,(Math.max(...xs)-Math.min(...xs))*1.6, (Math.max(...ys)-Math.min(...ys))*1.6*W/H);
    vh=vw*H/W; vx=Math.min(Math.max(cx-vw/2,0),W-vw); vy=Math.min(Math.max(cy-vh/2,0),H-vh);
  }
  const k=vw/W;
  const route=pts.map((a,i)=>(i?"L":"M")+a.x.toFixed(1)+" "+a.y.toFixed(1)).join(" ")+(home?" L"+home.x.toFixed(1)+" "+home.y.toFixed(1):"");

  box.innerHTML=`<svg viewBox="${vx.toFixed(1)} ${vy.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}" role="img" aria-label="${t("mapAria")}">
    <rect x="0" y="0" width="${W}" height="${H}" fill="var(--ash)"/>
    <path d="${path(PERIPH)} Z" fill="var(--bg)" stroke="var(--line)" stroke-width="${3*k}"/>
    <path d="${path(SEINE)}" fill="none" stroke="var(--stone)" stroke-opacity=".45" stroke-width="${16*k}" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path(CANAL)}" fill="none" stroke="var(--stone)" stroke-opacity=".35" stroke-width="${5*k}" stroke-linecap="round" stroke-linejoin="round"/>
    ${labels}
    <path class="rline" d="${route}" fill="none" stroke="var(--metro)" stroke-width="${(vw*0.011).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round" ${home?"":""}/>
    ${homeMk}${stops}
  </svg>
  <div class="cap"><span>${t("svgCap")}</span><button type="button" id="mapToggle">${zoom?t("svgAll"):t("svgZoom")}</button></div>`;
  $("#mapToggle").onclick=()=>drawSvgMap(p,!zoom);

/* Google Maps (falls back to the drawn map if Google can't load) */
let gmPromise=null, gmFailed=false;
window.gm_authFailure=()=>{ gmFailed=true; if(lastPlan) fallbackMap(lastPlan); };
function loadGoogleMaps(){
  if(window.google?.maps?.importLibrary) return Promise.resolve();
  return gmPromise ||= new Promise((res,rej)=>{
    window.__gmReady=res;
    const s=document.createElement("script");
    s.src=`https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&v=weekly&loading=async&language=${lang}&callback=__gmReady`;
    s.async=true; s.onerror=rej; document.head.appendChild(s);
    setTimeout(()=>rej(new Error("timeout")),10000);
  });
}
function mapStyle(dark){
  const c=dark?{geo:"#271A47",road:"#3E2F66",water:"#000000",txt:"#B7A6DE",halo:"#271A47",rail:"#5A4B80"}
              :{geo:"#E6D9FF",road:"#F4EEFF",water:"#C2ABF2",txt:"#4A3B70",halo:"#E6D9FF",rail:"#B5A0E6"};
  return [
    {elementType:"geometry",stylers:[{color:c.geo}]},
    {elementType:"labels.icon",stylers:[{visibility:"off"}]},
    {elementType:"labels.text.fill",stylers:[{color:c.txt}]},
    {elementType:"labels.text.stroke",stylers:[{color:c.halo}]},
    {featureType:"poi",stylers:[{visibility:"off"}]},
    {featureType:"road",elementType:"geometry",stylers:[{color:c.road}]},
    {featureType:"road.local",elementType:"labels",stylers:[{visibility:"off"}]},
    {featureType:"transit.line",elementType:"geometry",stylers:[{color:c.rail}]},
    {featureType:"transit.station.rail",elementType:"labels.icon",stylers:[{visibility:"on"},{saturation:-100}]},
    {featureType:"water",elementType:"geometry",stylers:[{color:c.water}]}
  ];
}
function directionsUrl(p, pts){
  const ll=s=>`${(+s.lat).toFixed(5)},${(+s.lng).toFixed(5)}`;
  const home=inCity(+p.retour_lat,+p.retour_lng)?{lat:p.retour_lat,lng:p.retour_lng}:null;
  const seq=pts.concat(home?[home]:[]);
  const q=new URLSearchParams({api:"1",origin:ll(seq[0]),destination:ll(seq[seq.length-1]),travelmode:"walking"});
  if(seq.length>2) q.set("waypoints",seq.slice(1,-1).map(ll).join("|"));
  return "https://www.google.com/maps/dir/?"+q.toString();
}
async function drawMap(p){
  const box=$("#map"); if(!box) return;
  const pts=(p.etapes||[]).filter(s=>inCity(+s.lat,+s.lng));
  if(!pts.length){ box.style.display="none"; return; }
  if(!GMAPS_KEY || gmFailed){ fallbackMap(p); return; }
  box.innerHTML=`<div class="gmap" id="gmap" role="region" aria-label="${t("mapAria")}"></div>
    <div class="cap"><span>${t("mapCheck")}</span><a href="${directionsUrl(p,pts)}" target="_blank" rel="noopener">${t("mapOpen")}</a></div>`;
  try{
    await loadGoogleMaps();
    const {Map,Polyline,InfoWindow}=await google.maps.importLibrary("maps");
    const {Marker}=await google.maps.importLibrary("marker");
    const {LatLngBounds}=await google.maps.importLibrary("core");
    if(gmFailed || lastPlan!==p) return;
    const css=getComputedStyle(box), bg=css.getPropertyValue("--bg").trim(), ink=css.getPropertyValue("--ink").trim();
    const dark=bg.toUpperCase()==="#271A47";
    const map=new Map($("#gmap"),{styles:mapStyle(dark),disableDefaultUI:true,zoomControl:true,gestureHandling:"cooperative",clickableIcons:false,backgroundColor:bg});
    const info=new InfoWindow(), bounds=new LatLngBounds();
    const route=[];
    pts.forEach((s,i)=>{
      const pos={lat:+s.lat,lng:+s.lng}; route.push(pos); bounds.extend(pos);
      const m=new Marker({map:calm()?map:null,position:pos,title:`${i+1}. ${s.lieu}`,zIndex:10+i,
        label:{text:String(i+1),color:ink,fontWeight:"700",fontFamily:"Inter, sans-serif",fontSize:"13px"},
        icon:{path:google.maps.SymbolPath.CIRCLE,scale:13,fillColor:bg,fillOpacity:1,strokeColor:ink,strokeWeight:4}});
      if(!calm()) setTimeout(()=>{ m.setAnimation(google.maps.Animation.DROP); m.setMap(map); },300+i*280);
      m.addListener("click",()=>{ info.setContent(`<div style="font:14px Inter,sans-serif;color:#000"><b>${esc(fmtTime(s.heure))} ${esc(s.lieu)}</b><br>${esc(s.quartier)}</div>`); info.open({map,anchor:m}); });
    });
    if(inCity(+p.retour_lat,+p.retour_lng)){
      const pos={lat:+p.retour_lat,lng:+p.retour_lng}; route.push(pos); bounds.extend(pos);
      new Marker({map,position:pos,title:t("returnLabel")+" : "+(p.retour_station||""),zIndex:5,
        label:{text:"M",color:"#000",fontWeight:"700",fontFamily:"Inter, sans-serif",fontSize:"13px"},
        icon:{path:"M -1 -1 L 1 -1 L 1 1 L -1 1 Z",scale:12,fillColor:getComputedStyle(document.documentElement).getPropertyValue("--lamp").trim()||"#7FFEB1",fillOpacity:1,strokeWeight:0}});
    }
    const line=new Polyline({map,path:calm()?route:[],strokeColor:ink,strokeOpacity:1,strokeWeight:4,zIndex:1});
    if(!calm() && route.length>1){
      const seg=520, total=(route.length-1)*seg; let t0=null;
      const step=ts=>{ if(t0===null) t0=ts; const el=Math.min(total,ts-t0), k=Math.floor(el/seg), f=(el%seg)/seg;
        const pts=route.slice(0,k+1);
        if(k<route.length-1){ const a=route[k], b=route[k+1]; pts.push({lat:a.lat+(b.lat-a.lat)*f,lng:a.lng+(b.lng-a.lng)*f}); }
        line.setPath(pts); if(el<total) requestAnimationFrame(step); };
      setTimeout(()=>requestAnimationFrame(step),300);
    }
    if(route.length>1) map.fitBounds(bounds,48); else { map.setCenter(route[0]); map.setZoom(16); }
    google.maps.event.addListenerOnce(map,"idle",()=>{ if(map.getZoom()>17) map.setZoom(17); });
  }catch(e){ gmFailed=true; fallbackMap(p); }
}

const mins=v=>{ const [h,m]=v.split(":").map(Number); return h*60+m; };

function missingKeys(){
  const out=[];
  if(friends.some(f=>!String(f.nick||"").trim())) out.push("needNames");
  if(friends.some(f=>f.level==null)) out.push("needBudgets");
  if(!friends.some(f=>f.vibe)) out.push("needVibe");
  if(!$("#area").value) out.push("needArea");
  if($("#end").value && !$("#start").value) out.push("needStart");
  if(!stops) out.push("needStopsMsg");
  const st=$("#start").value, en=$("#end").value;
  if(en && st){ let e=mins(en); if(mode==="night" && e<=6*60) e+=24*60; if(e<=mins(st)) out.push("needEndAfter"); }
  return out;
}

};

<p><b>Avis.</b> La note, le texte et le prénom facultatif que vous laissez. Si vous êtes connecté, votre e-mail est joint à l'avis pour que nous puissions vous répondre ; il n'est jamais affiché. Les avis de 4 ou 5 étoiles peuvent être affichés publiquement sur la page d'accueil.</p>
<p><b>Villes demandées.</b> La ville suggérée, la langue et le fuseau horaire.</p>
<p><b>Sur votre appareil.</b> Langue, devise, lieux déjà proposés et session de connexion sont gardés dans le stockage local de votre navigateur. Pas de cookies publicitaires. Nous mesurons la fréquentation de façon anonyme (Vercel Web Analytics, sans cookies).</p>
<h2>Nos prestataires</h2><p>Vercel (hébergement), Upstash (base de données), Resend (e-mails), Google (connexion, cartes, vérification des lieux et temps de trajet), Anthropic (rédaction des plans). Quand vous cliquez sur un lien partenaire (GetYourGuide, Fever, Ticketmaster), ce site peut déposer ses propres cookies et nous verser une commission.</p>
<h2>Durée de conservation</h2><p>Compte : jusqu'à sa suppression. Session de connexion : 60 jours. Sorties organisées : 30 jours. Sorties supprimées de votre historique : 3 jours dans les archives.</p>
<h2>Vos droits</h2><p>Vous pouvez supprimer votre compte à tout moment depuis « Mon compte » : votre profil et vos liens d'amitié sont effacés. Pour toute demande d'accès, de rectification ou de suppression, écrivez à {email}. Vous pouvez aussi contacter la CNIL.</p>`,
en:`<p>Last updated: October 2026.</p>
<h2>Who we are</h2><p>Tournée is an independent service. Contact: {email}.</p>
<h2>What we collect</h2>
<p><b>Account.</b> If you sign in with Google, we keep an encrypted Google identifier, your first name and your profile (usual budget, vibes, student, no alcohol, under 18, shown next to your name in your groups), plus your friend list. With Google, we also keep your email, but not your photo. If you create an account with an email, we keep your first name, last name, email and your password in hashed form (never in plain text).</p>
<p><b>Emails.</b> Your email is only used to let you know when someone invites you to a party or adds you as a friend, and to reset your password. Nothing else, no ads. You can turn off the invite and friend emails in "My account". They're sent through Resend.</p>
<p><b>History.</b> When you're signed in, your last 50 plans (date, city, places, names in the group) are kept in "My account", and also for friends who were part of the group. You can delete them one by one.</p>
<p><b>Hosted outings.</b> The names, budgets and vibes entered in a shared outing, kept for 30 days.</p>
<p><b>Plans.</b> To build a plan, the group's details (names, budgets, vibes, city, times) are sent to our technical providers. Tournée doesn't keep them.</p>
<p><b>Reviews.</b> The rating, text and optional first name you leave. If you're signed in, your email is attached to the review so we can reply; it's never shown. Reviews with 4 or 5 stars may be shown publicly on the homepage.</p>
<p><b>City requests.</b> The suggested city, the language and the time zone.</p>
<p><b>On your device.</b> Language, currency, places already suggested and your sign in session are kept in your browser's local storage. No advertising cookies. We measure visits anonymously (Vercel Web Analytics, no cookies).</p>
<h2>Our providers</h2><p>Vercel (hosting), Upstash (database), Resend (emails), Google (sign in, maps, place checks and travel times), Anthropic (writing the plans). When you click a partner link (GetYourGuide, Fever, Ticketmaster), that site may set its own cookies and pay us a commission.</p>
<h2>How long we keep data</h2><p>Account: until you delete it. Sign in session: 60 days. Hosted outings: 30 days. Outings deleted from your history: 3 days in the archive.</p>
<h2>Your rights</h2><p>You can delete your account at any time from "My account": your profile and friend links are erased. For any request to access, correct or delete your data, write to {email}.</p>`,
es:`<p>Última actualización: octubre de 2026.</p>
<h2>Quiénes somos</h2><p>Tournée es un servicio independiente. Contacto: {email}.</p>
<h2>Qué recogemos</h2>
<p><b>Correos.</b> Tu correo solo sirve para avisarte cuando alguien te invita a una salida o te añade como amigo, y para restablecer tu contraseña. Nada más, sin publicidad. Puedes desactivar los correos de invitaciones y amigos en "Mi cuenta". Se envían a través de Resend.</p>
<p><b>Cuenta.</b> Si inicias sesión con Google, guardamos un identificador de Google cifrado, tu nombre y tu perfil (presupuesto habitual, gustos, estudiante, sin alcohol, menor de 18, indicado junto a tu nombre en tus grupos), además de tu lista de amigos. Con Google, también guardamos tu correo, pero no tu foto. Si creas una cuenta con correo, guardamos tu nombre, tu apellido, tu correo y tu contraseña cifrada (nunca en texto claro).</p>
<p><b>Historial.</b> Si has iniciado sesión, tus últimos 50 planes (fecha, ciudad, lugares, nombres del grupo) se guardan en "Mi cuenta", y también para los amigos que formaban parte del grupo. Puedes eliminarlos uno a uno.</p>
<p><b>Quedadas organizadas.</b> Los nombres, presupuestos y gustos introducidos en una quedada compartida, guardados 30 días.</p>
<p><b>Planes.</b> Para crear un plan, los datos del grupo (nombres, presupuestos, gustos, ciudad, horarios) se envían a nuestros proveedores técnicos. Tournée no los guarda.</p>
<p><b>Opiniones.</b> La valoración, el texto y el nombre opcional que dejas. Si has iniciado sesión, tu correo se adjunta a la opinión para poder responderte; nunca se muestra. Las opiniones de 4 o 5 estrellas pueden mostrarse públicamente en la página de inicio.</p>
<p><b>Ciudades solicitadas.</b> La ciudad sugerida, el idioma y la zona horaria.</p>
<p><b>En tu dispositivo.</b> El idioma, la moneda, los lugares ya propuestos y tu sesión se guardan en el almacenamiento local del navegador. Sin cookies publicitarias. Medimos las visitas de forma anónima (Vercel Web Analytics, sin cookies).</p>
<h2>Nuestros proveedores</h2><p>Vercel (alojamiento), Upstash (base de datos), Resend (correos), Google (inicio de sesión, mapas, verificación de lugares y tiempos de trayecto), Anthropic (redacción de los planes). Al hacer clic en un enlace de afiliado (GetYourGuide, Fever, Ticketmaster), ese sitio puede usar sus propias cookies y pagarnos una comisión.</p>
<h2>Cuánto tiempo guardamos los datos</h2><p>Cuenta: hasta que la elimines. Sesión: 60 días. Quedadas: 30 días. Salidas eliminadas de tu historial: 3 días en el archivo.</p>
<h2>Tus derechos</h2><p>Puedes eliminar tu cuenta en cualquier momento desde "Mi cuenta": tu perfil y tus amistades se borran. Para cualquier solicitud de acceso, rectificación o eliminación, escribe a {email}.</p>`
};

let acct=null, acctCfg=null, gsiLoaded=null, pendingCode=null, invite=null;
// a friend link opened while signed out is remembered for a day, so it still works after a reload or a detour
const FCODE="tournee-fcode";
try{ const f=JSON.parse(localStorage.getItem(FCODE)||"null"); if(f&&Date.now()-f.at<864e5) pendingCode=f.code; else localStorage.removeItem(FCODE); }catch{}
function keepCode(code){ pendingCode=code; try{ code?localStorage.setItem(FCODE,JSON.stringify({code,at:Date.now()})):localStorage.removeItem(FCODE); }catch{} }
const session=()=>{ try{ return localStorage.getItem("tournee-session")||""; }catch{ return ""; } };
const setSession=v=>{ try{ v?localStorage.setItem("tournee-session",v):localStorage.removeItem("tournee-session"); }catch{} };
async function acctApi(body){
  try{
    const r=await fetch("/api/account",{method:"POST",headers:{"Content-Type":"application/json",...(session()?{Authorization:"Bearer "+session()}:{})},body:JSON.stringify({...body,lang})});
    const d=await r.json().catch(()=>({})); if(!r.ok) d.error=d.error||"server";
    if(d.error==="signed_out"){ setSession(""); acct=null; updateAcctBtn(); }
    return d;
  }catch{ return {error:"server"}; }
}
/* ===== Reviews ===== */
let rvStars=0, rvLoaded=false;
function renderStars(){
  $("#rvStars").innerHTML=[1,2,3,4,5].map(n=>`<button type="button" role="radio" aria-checked="${n===rvStars}" aria-label="${esc(t("starAria",{n}))}" data-star="${n}" class="${n<=rvStars?"lit":""}">★</button>`).join("");
}
$("#reviewOpen").onclick=()=>{ const f=$("#reviewForm"), open=f.hidden; f.hidden=!open; $("#reviewOpen").setAttribute("aria-expanded",String(open));
  if(open){ $("#reviewBox").scrollIntoView({behavior:calm()?"auto":"smooth",block:"center"}); renderStars(); if(acct&&!$("#rvName").value) $("#rvName").value=acct.me.nick||""; $("#rvMsg").textContent=""; } };
$("#rvStars").addEventListener("click",e=>{ const b=e.target.closest("[data-star]"); if(!b) return; rvStars=+b.dataset.star; renderStars(); $("#rvStars").querySelector(`[data-star="${rvStars}"]`).focus(); });
$("#rvStars").addEventListener("keydown",e=>{ if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft") return; e.preventDefault(); rvStars=Math.min(5,Math.max(1,(rvStars||0)+(e.key==="ArrowRight"?1:-1))); renderStars(); $("#rvStars").querySelector(`[data-star="${rvStars}"]`).focus(); });
$("#reviewForm").addEventListener("submit",async e=>{ e.preventDefault();
  if(!rvStars){ $("#rvMsg").textContent=t("reviewNeedStars"); return; }
  const btn=$("#reviewForm .btn"); btn.disabled=true;
  let r={}; try{ const res=await fetch("/api/review",{method:"POST",headers:{"Content-Type":"application/json",...(session()?{Authorization:"Bearer "+session()}:{})},body:JSON.stringify({stars:rvStars,name:$("#rvName").value.trim(),text:$("#rvText").value.trim(),lang,city:(typeof city!=="undefined"&&city&&!$("#planner").hidden)?cityName(city):""})}); r=await res.json().catch(()=>({})); if(!res.ok) r.error=r.error||"server"; }catch{ r={error:"server"}; }
  btn.disabled=false;
  if(r.error){ $("#rvMsg").textContent=t(r.error==="already"?"reviewAlready":"errGeneric"); return; }
  rvStars=0; $("#rvText").value=""; $("#reviewForm").hidden=true; $("#reviewOpen").setAttribute("aria-expanded","false"); $("#rvMsg").textContent=t("reviewThanks"); rvLoaded=false; });
async function loadReviews(){
  if(rvLoaded) return; rvLoaded=true;
  try{ const d=await fetch("/api/review").then(r=>r.json()); const list=d.reviews||[];
    $("#reviewsStrip").hidden=!list.length;
    $("#rvTrack").innerHTML=list.map(r=>`<article class="rv-card"><span class="st" aria-label="${esc(t("starAria",{n:r.stars}))}">${"★".repeat(r.stars)}</span><p>${esc(r.text)}</p>${r.name||r.city?`<span class="who">${esc([r.name,r.city].filter(Boolean).join(" · "))}</span>`:""}</article>`).join("");
  }catch{ $("#reviewsStrip").hidden=true; rvLoaded=false; }
}

/* ===== Notifications ===== */
let notifs=[], unread=0, joinedNid=null;
function setNotifs(d){ if(!d) return; if(Array.isArray(d.notifs)) notifs=d.notifs; if(typeof d.unread==="number") unread=d.unread; renderBell(); if(!$("#notifPanel").hidden) renderNotifs(); }
function renderBell(){ const b=$("#bellBtn"); b.hidden=!acct; b.classList.toggle("on",unread>0); b.setAttribute("aria-label",t("notifTitle")+(unread?` (${unread})`:"")); if(!acct) $("#notifPanel").hidden=true; }
function renderNotifs(){
  const list=$("#notifList");
  const items=notifs.map(n=>{ const c=CITIES.find(x=>x.id===n.city), cn=c?cityName(c):n.city;
    if(n.type==="sent"){ const nm=n.names||[], who=nm.length>1?nm.slice(0,-1).join(", ")+" "+t("andW")+" "+nm[nm.length-1]:(nm[0]||"?");
      const msg=t(nm.length>1?"sentMany":"sentOne",{n:who,m:t(n.mode==="day"?"mDay":"mNight"),c:cn});
      return `<li><span>${esc(msg)}</span><span class="np-act"><a href="/o/${esc(n.outing)}" data-go="${esc(n.outing)}" data-nid="${esc(n.nid)}">${t("seeGroup")}</a><button type="button" data-dec="${esc(n.nid)}">${t("dismiss")}</button></span></li>`; }
    if(n.type==="added"){ const msg=t(n.mode==="day"?"addedDay":"addedNight",{n:n.from||"?",c:cn});
      return `<li><span>${esc(msg)}</span><span class="np-act"><a href="/o/${esc(n.outing)}" data-go="${esc(n.outing)}" data-nid="${esc(n.nid)}">${t("seeGroup")}</a><button type="button" data-dec="${esc(n.nid)}">${t("dismiss")}</button></span></li>`; }
    const msg=t(n.mode==="day"?"invDay":"invNight",{n:n.from,c:cn});
    return `<li><span>${esc(msg)}</span><span class="np-act"><button type="button" data-acc="${esc(n.nid)}">${t("joinBtn")}</button><button type="button" data-dec="${esc(n.nid)}">${t("decline")}</button></span></li>`; });
  if(joinedNid) items.unshift(`<li><span>${t("joinedMsg")}</span><span class="np-act"><a href="/o/${esc(joinedNid)}" data-go="${esc(joinedNid)}">${t("seeGroup")}</a></span></li>`);
  list.innerHTML=items.length?items.join(""):`<li><span class="hint">${t("noNotifs")}</span></li>`;
}
$("#bellBtn").onclick=async e=>{ e.stopPropagation();
  const p=$("#notifPanel"), open=p.hidden; p.hidden=!open; $("#bellBtn").setAttribute("aria-expanded",String(open));
  if(open){ joinedNid=null; renderNotifs(); if(unread){ unread=0; renderBell(); acctApi({action:"seenNotifs"}); } } };
$("#notifPanel").addEventListener("click",async e=>{ e.stopPropagation();
  const acc=e.target.closest("[data-acc]"), dec=e.target.closest("[data-dec]"), g=e.target.closest("[data-go]");
  if(g){ e.preventDefault(); if(g.dataset.nid) acctApi({action:"declineInvite",nid:g.dataset.nid}).then(r=>{ if(r.notifs) notifs=r.notifs; }); $("#notifPanel").hidden=true; $("#bellBtn").setAttribute("aria-expanded","false"); go("o/"+g.dataset.go); return; }
  if(dec){ const r=await acctApi({action:"declineInvite",nid:dec.dataset.dec}); if(!r.error) setNotifs({notifs:r.notifs}); renderNotifs(); return; }
  if(acc){ acc.disabled=true; const r=await acctApi({action:"acceptInvite",nid:acc.dataset.acc});
    if(r.notifs) notifs=r.notifs;
    if(r.error){ renderNotifs(); $("#notifList").insertAdjacentHTML("afterbegin",`<li><span class="hint">${t(r.error==="full"?"full":"inviteGone")}</span></li>`); return; }
    if(r.groups) acct.groups=r.groups; joinedNid=r.outing; renderNotifs(); if(!$("#accountView").hidden) renderGroups(); } });
document.addEventListener("click",e=>{ const p=$("#notifPanel"); if(!p.hidden && !p.contains(e.target) && e.target!==$("#bellBtn")){ p.hidden=true; $("#bellBtn").setAttribute("aria-expanded","false"); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#notifPanel").hidden){ $("#notifPanel").hidden=true; $("#bellBtn").setAttribute("aria-expanded","false"); $("#bellBtn").focus(); } });
setInterval(async()=>{ if(!acct||document.hidden) return; const d=await acctApi({action:"notifs"}); if(!d.error) setNotifs(d); },30000);
function resetPwForms(){ $("#gsiBtn").hidden=false; $("#loginForm").hidden=false; $("#signupForm").hidden=true; $("#forgotForm").hidden=true; $("#resetForm").hidden=true; $("#pwMsg").textContent=""; }
function updateAcctBtn(){
  if(typeof renderBell==="function") renderBell();
  renderBackGroup();
  const b=$("#acctBtn");
  if(acct){ b.classList.add("in"); b.textContent=(acct.me.nick||"?").charAt(0).toUpperCase(); b.setAttribute("aria-label",t("account")); }
  else { b.classList.remove("in"); b.textContent=t("signIn"); b.removeAttribute("aria-label"); }
}
$("#acctBtn").onclick=()=>go("account");
let refreshingAcct=false;
async function loadAcct(){
  if(!session()) { updateAcctBtn(); return; }
  const d=await acctApi({action:"me"});
  if(!d.error){ acct={me:d.me,friends:d.friends,history:d.history||[],archive:d.archive||[],groups:d.groups||[]}; setNotifs(d);
    if(pendingCode){ const code=pendingCode; keepCode(null); await addFriendCode(code); }
    if(!$("#planner").hidden && !outing && friends.length===1 && isBlankRow(friends[0])){ friends[0]=personRow(acct.me); renderFriends(); } }
  updateAcctBtn(); renderChips();
  if(outing){ applyOuting(outing,true); maybeClaim(); }
  if(!$("#accountView").hidden) renderAccount();
}
function loadGsi(){
  return gsiLoaded ||= new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src="https://accounts.google.com/gsi/client"; sc.async=true; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); });
}
async function showSignIn(){
  const box=$("#gsiBtn"); box.innerHTML=""; $("#pwMsg").textContent="";
  if(resetToken){ $("#orLine").hidden=true; return; } // the reset page only shows the new password form
  try{
    acctCfg ||= await fetch("/api/account").then(r=>r.json());
    if(!acctCfg.ready){ $("#acctMsg").textContent=t("acctOff"); $("#loginForm").hidden=$("#signupForm").hidden=$("#orLine").hidden=true; return; }
    if(!acctCfg.clientId){ $("#orLine").hidden=true; return; }
    $("#orLine").hidden=false;
    await loadGsi();
    google.accounts.id.initialize({client_id:acctCfg.clientId, callback:onCredential});
    google.accounts.id.renderButton(box,{theme:"outline",size:"large",shape:"pill",text:"signin_with",logo_alignment:"center",width:Math.max(240,Math.min(400,box.clientWidth||400)),locale:lang});
  }catch{ box.innerHTML=""; $("#orLine").hidden=true; }
}
const PW_ERR={exists:"errExists",creds:"errCreds",weak:"errWeak",email:"errEmail",missing:"errMissing",too_many:"errTooMany"};
async function signedIn(d){
  setSession(d.token); acct={me:d.me,friends:d.friends,history:d.history||[],archive:d.archive||[],groups:d.groups||[]}; setNotifs(d); updateAcctBtn();
  if(pendingCode){ const code=pendingCode; keepCode(null); await addFriendCode(code); }
  renderAccount();
}
// forgot password: ask for the email, then the emailed link opens /reset/<token> to choose a new one
let resetToken=null;
$("#toForgot").onclick=()=>{ $("#loginForm").hidden=true; $("#forgotForm").hidden=false; $("#fgEmail").value=$("#liEmail").value; $("#pwMsg").textContent=""; $("#fgEmail").focus(); };
$("#fgBack").onclick=()=>{ $("#forgotForm").hidden=true; $("#loginForm").hidden=false; $("#pwMsg").textContent=""; };
$("#forgotForm").addEventListener("submit",async e=>{ e.preventDefault();
  const email=$("#fgEmail").value.trim(); if(!email){ $("#pwMsg").textContent=t("errMissing"); return; }
  const btn=$("#forgotForm .cta"); btn.disabled=true;
  const d=await acctApi({action:"forgot",email}); btn.disabled=false;
  $("#pwMsg").textContent=d.error==="email"?t("errEmail"):t("forgotSent"); });
$("#resetForm").addEventListener("submit",async e=>{ e.preventDefault();
  const a=$("#rsPw").value, b=$("#rsPw2").value;
  if(a.length<8){ $("#pwMsg").textContent=t("errWeak"); return; }
  if(a!==b){ $("#pwMsg").textContent=t("errMatch"); return; }
  const btn=$("#resetForm .cta"); btn.disabled=true;
  const d=await acctApi({action:"reset",token:resetToken,password:a}); btn.disabled=false;
  if(d.error){ $("#pwMsg").textContent=t(d.error==="weak"?"errWeak":"errLink"); return; }
  resetToken=null; $("#rsPw").value=$("#rsPw2").value=""; history.replaceState(null,"","/account"); resetPwForms(); signedIn(d); });
$("#toSignup").onclick=()=>{ $("#loginForm").hidden=true; $("#signupForm").hidden=false; $("#pwMsg").textContent=""; $("#suFirst").focus(); };
$("#toLogin").onclick=()=>{ $("#signupForm").hidden=true; $("#loginForm").hidden=false; $("#pwMsg").textContent=""; $("#liEmail").focus(); };
$("#loginForm").addEventListener("submit",async e=>{ e.preventDefault();
  const email=$("#liEmail").value.trim(), password=$("#liPw").value;
  if(!email||!password){ $("#pwMsg").textContent=t("errMissing"); return; }
  const btn=e.submitter||$("#loginForm .cta"); btn.disabled=true;
  const d=await acctApi({action:"loginPw",email,password}); btn.disabled=false;
  if(d.error){ $("#pwMsg").textContent=t(PW_ERR[d.error]||"signInError"); return; }
  $("#liPw").value=""; signedIn(d); });
$("#signupForm").addEventListener("submit",async e=>{ e.preventDefault();
  const first=$("#suFirst").value.trim(), last=$("#suLast").value.trim(), email=$("#suEmail").value.trim(), password=$("#suPw").value;
  if(!first||!last||!email||!password){ $("#pwMsg").textContent=t("errMissing"); return; }
  if(password.length<8){ $("#pwMsg").textContent=t("errWeak"); return; }
  const btn=$("#signupForm .cta"); btn.disabled=true;
  const d=await acctApi({action:"register",first,last,email,password}); btn.disabled=false;
  if(d.error){ $("#pwMsg").textContent=t(PW_ERR[d.error]||"signInError"); return; }
  $("#suPw").value=""; signedIn(d); });
async function onCredential(resp){
  const d=await acctApi({action:"login",credential:resp.credential});
  if(d.error){ $("#acctMsg").textContent=t("signInError"); return; }
  setSession(d.token); acct={me:d.me,friends:d.friends,history:d.history||[],archive:d.archive||[],groups:d.groups||[]}; setNotifs(d); updateAcctBtn();
  if(pendingCode){ const code=pendingCode; keepCode(null); await addFriendCode(code); }
  renderAccount();
}
async function addFriendCode(code){
  const d=await acctApi({action:"addFriend",code});
  if(d.error==="self") $("#acctMsg").textContent=t("inviteSelf");
  else if(d.error) $("#acctMsg").textContent=t("inviteBad");
  else { acct.friends=d.friends; $("#acctMsg").textContent=t("friendAdded",{n:d.added}); }
  if(location.pathname.startsWith("/f/")) history.replaceState(null,"","/account");
}
function profLevelCode(){ return dispPref==="USD"?"USD":"EUR"; }
// groups: 3 at a time, status, delete (host, for everyone) or remove (member, from my list only)
let groupsShown=3;
function renderGroups(){
  renderBackGroup();
  const all=acct?.groups||[], g=all.slice(0,groupsShown);
  const df=new Intl.DateTimeFormat(lang==="en"?"en-US":lang==="es"?"es-ES":"fr-FR",{day:"numeric",month:"short"});
  $("#gList").innerHTML=g.length?g.map(x=>{ const c=CITIES.find(y=>y.id===x.city);
    return `<li><span class="hmeta">${x.date?esc(df.format(new Date(x.date+"T12:00:00")))+" · ":x.created?esc(df.format(new Date(x.created)))+" · ":""}${esc(t(MODES[x.mode]?.label||"pickNight"))}</span>
      <span class="htitle">${esc(c?cityName(c):x.city)}</span>
      <span class="hpeople">${(x.names||[]).length?x.names.map(esc).join(", "):x.count?`${x.count} ${t(x.count===1?"person1":"people")}`:t("groupEmpty")}</span>
      <span class="hact"><a class="remove" href="/o/${esc(x.id)}" data-open="${esc(x.id)}" style="text-decoration:none">${t("open")}</a>${creds(x.id).admin?`<button class="remove" type="button" data-inv="${esc(x.id)}">${t("inviteFriends")}</button>`:""}${x.host||creds(x.id).admin?`<button class="remove" type="button" data-gdel="${esc(x.id)}">${t("del")}</button>`:`<button class="remove" type="button" data-gleave="${esc(x.id)}">${t("groupLeave")}</button>`}</span>
      <div class="inv-box" id="inv-${esc(x.id)}" hidden></div></li>`; }).join("")
    +(all.length>groupsShown?`<li class="hmore"><button class="suggest-link" type="button" data-gmore>${t(groupsShown===3?"seeAll":"seeMore")}</button></li>`:"")
    :`<li><span class="hpeople">${t("noGroups")}</span></li>`;
}
$("#gList").addEventListener("click",async e=>{

function route(keepScroll){
  const [m0,c0,extra]=location.pathname.split("/").filter(Boolean);
  const isOuting=m0==="o" && !!c0 && !extra;
  const special=(m0==="account"||m0==="privacy"||m0==="terms") && !c0 ? m0 : (m0==="f" && c0 && !extra ? "friend" : m0==="reset" && /^[a-f0-9]{64}$/.test(c0||"") && !extra ? "reset" : "");
  const valid=!m0 || isOuting || special || (MODES[m0] && (!c0 || CITIES.some(x=>x.id===c0)) && !extra);
  if(!valid){ history.replaceState(null,"","/"); return route(keepScroll); }
  const c=MODES[m0]?CITIES.find(x=>x.id===c0):null;
  const view=special?(special==="privacy"||special==="terms"?special:"account"):isOuting?"planner":!MODES[m0]?"start":c?"planner":"home";
  if(MODES[m0]){ mode=m0; applyMode(); }
  else if(!isOuting && !special){ document.documentElement.dataset.theme="light"; delete document.documentElement.dataset.mode; }
  if(view!=="home") hostingPick=false;
  $("#landing").hidden=view!=="start"; $("#home").hidden=view!=="home"; $("#planner").hidden=view!=="planner";
  $("#accountView").hidden=view!=="account"; $("#privacyView").hidden=view!=="privacy"; $("#termsView").hidden=view!=="terms";
  $("#cityTag").hidden=view!=="planner";
  $("#hostBtn").hidden=!(view==="home"||(view==="planner"&&!isOuting));
  $("#go").hidden=view!=="planner"; $("#status").hidden=view!=="planner";
  document.querySelector("footer").hidden=view==="start";
  document.querySelector("header").classList.toggle("noline",view==="start");
  $("#reviewBox").hidden=view==="start"; if(view==="start"){ loadReviews(); if(acct) loadAcct(); } // fresh party list for the home button
  document.getElementById("sky").classList.toggle("on",view!=="start");
  if(isOuting){ const key="o/"+c0; if(key!==opened){ opened=key; loadOuting(c0); } }
  else if(view==="planner"){ const key=mode+"/"+c.id; if(key!==opened){ openCity(c); opened=key; } document.title="Tournée, "+cityName(c); }
  else if(view==="account"){ opened=""; invite=null; $("#acctMsg").textContent=""; document.title="Tournée, "+t("account");
    if(special==="reset"){ resetToken=c0; if(acct){ setSession(""); acct=null; updateAcctBtn(); }
      renderAccount(); $("#acctH1").textContent=t("resetTitle"); $("#acctP").textContent="";
      $("#gsiBtn").hidden=true; $("#orLine").hidden=true; $("#loginForm").hidden=true; $("#signupForm").hidden=true; $("#forgotForm").hidden=true; $("#resetForm").hidden=false; $("#pwMsg").textContent=""; $("#rsPw").focus(); }
    else if(special==="friend"){ const code=c0; acctApi({action:"peek",code}).then(d=>{ if(d.error){ $("#acctMsg").textContent=t("inviteBad"); history.replaceState(null,"","/account"); renderAccount(); return; }
      invite=d.nick; if(acct) addFriendCode(code).then(renderAccount); else { keepCode(code); renderAccount(); } }); }
    else { renderAccount(); if(acct&&!refreshingAcct){ refreshingAcct=true; loadAcct().finally(()=>refreshingAcct=false); } } }
  else if(view==="terms"){ opened=""; $("#termsText").innerHTML=TERMS[lang].replaceAll("{email}",`<a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a>`); document.title="Tournée, "+t("terms"); }
  else if(view==="privacy"){ opened=""; renderPrivacy(); document.title="Tournée, "+t("privacy"); }
  else if(view==="home"){ opened=""; outing=null; renderCities(keepScroll!==true); document.title="Tournée, "+t(M().label).toLowerCase(); }
  else { opened=""; outing=null; document.title="Tournée"; }
  if(keepScroll!==true) window.scrollTo(0,0);
}

$("#lang").addEventListener("change",e=>{
  lang=e.target.value; try{localStorage.setItem("tournee-lang",lang)}catch{}
  const keep=$("#start").value, keepEnd=$("#end").value; applyLang(); fillTimes(keep); fillEnd(keepEnd); route(true);
  updateAcctBtn(); if(!$("#accountView").hidden) renderAccount(); if(!$("#reviewForm").hidden) renderStars(); if(!$("#privacyView").hidden) renderPrivacy();
  if(!$("#planner").hidden){ if(outing){ applyOuting(outing,"lang"); } else { cityTexts(); renderFriends(); if(lastPlan) renderPlan(lastPlan,lastIsExample,true); } }
});
applyLang();
route();
</script>
