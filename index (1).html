@keyframes hw-drop{0%,100%{--len:70px}50%{--len:150px}}
@property --len{syntax:"<length>";inherits:true;initial-value:120px}
@keyframes hw-sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@media (max-width:600px){.hw-spider{right:28px}@keyframes hw-drop{0%,100%{--len:46px}50%{--len:96px}}}
@media (prefers-reduced-motion:reduce){.hw-spider,.hw-spider svg{animation:none}}
@media print{.hw-web,.hw-spider{display:none}}
:root[data-theme="dark"] .band{
  --bg:#DBC9FF; --surface:#DBC9FF; --ash:#CFBBF7; --ink:#271A47; --charcoal:#271A47;
  --muted:#4A3B70; --stone:#5A4B80; --line:#B5A0E6; --field:#DBC9FF;
  --accent:#271A47; --jewel:#271A47; --metro:#271A47; --onmetro:#DBC9FF; --media:#271A47;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;
  font-size:16px;line-height:1.65;letter-spacing:.036em;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .35s,color .35s}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
[hidden]{display:none !important}

/* labels: Inter 600 uppercase, wide tracking */
.label,.brand,.city-tag,.switch,.remove,.stop-type,.badge,.budget label,.field label,.map a,.map button,.cta,.btn,.add{
  font-family:var(--sans);font-weight:600;text-transform:uppercase;letter-spacing:.111em}

header{display:flex;align-items:center;gap:12px;padding:16px 20px;margin:0 -20px;border-bottom:1px solid var(--line)}
.home-link{display:flex;align-items:center;gap:10px;color:var(--accent);text-decoration:none}
.home-link:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
.brand{font-size:12px}
.mark{width:28px;height:28px}
.city-tag{border:1px solid var(--accent);color:var(--accent);border-radius:30px;padding:3px 12px;font-size:11px}
#homeText:empty{display:none}
#status.err{display:flex;align-items:center;gap:10px;width:fit-content;max-width:100%;margin-inline:auto;padding:10px 16px;border:1.5px solid #BC994E;border-radius:30px;
  background:color-mix(in srgb,#BC994E 16%,transparent);color:var(--ink);font-size:14px;font-weight:600;text-align:left}
#status.err::before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;background:#BC994E;color:#271A47;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
@media (prefers-reduced-motion: no-preference){#status.err{animation:st-blink .42s ease-in-out 2}}
@keyframes st-blink{0%,100%{opacity:1}50%{opacity:.12}}
header.noline{border-bottom-color:transparent}
#groupHint,#joinHint,#acctP{display:none!important}
.panel h2{margin-bottom:18px!important}
button.city-tag{background:none;font:inherit;font-size:11px;font-weight:600;letter-spacing:.111em;text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s}
button.city-tag:hover{background:var(--accent);color:var(--bg)}
button.city-tag:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.controls{margin-inline-start:auto;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:6px 14px}
@media (max-width:560px){header .city-tag{display:none}}
.switch{background:none;border:0;color:var(--jewel);font-size:11px;cursor:pointer;padding:8px 0;white-space:nowrap}
header select.lang{width:auto;padding:4px 30px 4px 14px;font-size:12px;font-weight:600;letter-spacing:.111em;border:1px solid var(--accent);color:var(--accent);
  background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%}

/* display: Garamond-class serif */
.hero{padding:56px 0 56px}
.hero h1{font-family:var(--serif);font-weight:400;color:var(--accent);
  font-size:clamp(3.2rem,15vw,6.4rem);line-height:1.02;letter-spacing:0;margin:0 0 24px}
.hero h1{text-wrap:balance}
#planner .hero h1{font-size:clamp(2.2rem,11.5vw,5rem)}
.hero h1 .ln{display:block;white-space:nowrap}
.hero p{color:var(--charcoal);margin:0;max-width:38ch;font-size:16px}

.panel{padding:40px 0;border-top:1px solid var(--line)}
.panel h2{font-family:var(--serif);font-size:42px;font-weight:400;color:var(--accent);margin:0 0 10px;line-height:1.1;letter-spacing:0}
.panel .hint{color:var(--muted);font-size:14px;margin:0 0 24px}
.friend{display:grid;grid-template-columns:1fr auto;gap:12px;padding:20px 0;border-top:1px solid var(--line)}
.friend:first-of-type{border-top:0;padding-top:0}
.friend-top{display:flex;gap:10px;align-items:center;grid-column:1/-1}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--jewel)}
.dot.st-in{background:#34C77B;box-shadow:0 0 0 3px rgba(52,199,123,.18)}
.dot.st-pending{background:#F2B632;box-shadow:0 0 0 3px rgba(242,182,50,.2)}
.dot.st-none{background:var(--line)}
@media (prefers-reduced-motion: no-preference){.dot.st-pending{animation:st-pulse 1.8s ease-in-out infinite}}
@keyframes st-pulse{50%{box-shadow:0 0 0 6px rgba(242,182,50,0)}}
.sum-p{display:inline-flex;align-items:center;gap:6px;margin-right:12px}
.sum-who:has(.sum-p){overflow:visible;white-space:normal;display:flex;flex-wrap:wrap;row-gap:4px}
.sum-p .dot{width:7px;height:7px}
/* hover (or tap) a dot to see "Confirmé" / "En attente" */
.dot[data-tip]{position:relative;cursor:default;outline:none}
.dot[data-tip]::before{content:"";position:absolute;inset:-8px}
.dot[data-tip]::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,4px);background:var(--ink);color:var(--bg);font-size:11px;font-weight:600;letter-spacing:.04em;white-space:nowrap;padding:4px 9px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:20}
.dot[data-tip]:hover::after,.dot[data-tip]:focus::after{opacity:1;transform:translate(-50%,0)}
.rsvp-box{display:flex;flex-direction:column;gap:12px}
.rsvp-box p{margin:0}
.rsvp-btns{display:flex;gap:10px;flex-wrap:wrap}.rsvp-btns .btn{flex:none}
input[type=text],input[type=date],select{font:inherit;letter-spacing:.036em;color:var(--ink);background:var(--field);border:1px solid var(--line);
  border-radius:30px;padding:10px 18px;width:100%;min-width:0;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);
  background-position:calc(100% - 22px) 55%,calc(100% - 17px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.remove{background:none;border:0;color:var(--jewel);font-size:11px;padding:8px;cursor:pointer;flex:none}
.friend-row{grid-column:1/-1;display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.budget label,.field label{display:block;font-size:11px;color:var(--accent);margin-bottom:6px}
.budget-val{font-weight:400;font-size:14px;text-transform:none;letter-spacing:.036em;color:var(--ink);margin-inline-start:6px}
input[type=range]{width:100%;accent-color:var(--accent);margin-top:10px}
.check{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--charcoal)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stops-field{margin-top:20px}
.stops{display:flex;gap:8px;flex-wrap:wrap}
.stops button{min-width:48px;padding:8px 16px;border:1px solid var(--line);border-radius:30px;background:transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.stops button:hover{border-color:var(--accent)}
.stops button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--bg)}

/* ghost pill buttons, fill on hover */
.add,.cta,.btn{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:30px;font-size:13px;cursor:pointer;transition:background .15s,color .15s}
.add{margin-top:20px;padding:12px 20px}
.cta{display:block;width:100%;padding:18px 20px;font-size:14px}
.btn{flex:1 1 180px;padding:12px 20px}
.cta::after,.btn.primary::after{content:" →"}
.add:hover,.cta:hover,.btn:hover{background:var(--accent);color:var(--bg)}
.cta:disabled{opacity:.5;cursor:progress}
.note{color:var(--muted);font-size:13px;margin:14px 0 64px;text-align:center}

/* result */
#result:empty{display:none}
#result{padding:64px 0 72px}
.badge{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:30px;padding:4px 14px;font-size:11px;margin-bottom:24px}
.res-head h2{font-family:var(--serif);font-weight:400;color:var(--accent);
  font-size:clamp(2.8rem,12vw,5rem);overflow-wrap:anywhere;line-height:1.02;letter-spacing:0;margin:0 0 18px}
.res-head p{margin:0;color:var(--charcoal);font-size:16px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}
.pill{border:1px solid var(--line);border-radius:30px;padding:4px 14px;font-size:13px}
.pill b{font-weight:600;color:var(--jewel)}
.compromis{margin:0 0 32px;color:var(--charcoal);font-size:15px}
.map{overflow:hidden;margin:0 0 40px;border-radius:10px;background:var(--media);color:#DBC9FF}
.map svg{display:block;width:100%;height:auto}
.gmap{width:100%;height:min(60vh,380px)}
.map a,.map button{white-space:nowrap;color:var(--jewel);font-size:11px;text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.band .map a,.band .map button{color:#BC994E}
.map a:focus-visible{outline:1px solid currentColor;outline-offset:3px}
.map .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;font-size:12px;color:#B7A6DE}
.line{list-style:none;margin:0;padding:0;position:relative;--tcol:44px}
:root[lang="en"] .line{--tcol:74px}
.line.notimes .time{display:none}
.line.notimes .stop{grid-template-columns:30px 1fr}
.line.notimes::before{left:15px}
.line::before{content:"";position:absolute;left:calc(var(--tcol) + 28px);top:12px;bottom:12px;width:2px;background:var(--metro)}
.stop{display:grid;grid-template-columns:var(--tcol) 30px 1fr;gap:0 12px;padding-bottom:32px;position:relative}
.stop:last-child{padding-bottom:0}
.time{font-weight:600;font-size:13px;letter-spacing:.111em;color:var(--jewel);white-space:nowrap;padding-top:4px;text-align:right}
.station{width:18px;height:18px;border-radius:50%;background:var(--bg);border:2px solid var(--metro);margin:4px 0 0 7px;position:relative;z-index:1}
.stop.home .station{background:var(--jewel);border-color:var(--jewel)}
.stop-type{font-size:11px;color:var(--accent);margin:0 0 2px}
.stop h3{margin:0;font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.1;letter-spacing:0}
.stop .area{color:var(--muted);font-size:13px;margin:4px 0 8px}
.stop h3 + .why,.stop h3 + .area{margin-top:6px}
.stop .why{margin:0 0 8px;font-size:15px}
.stop .meta{font-size:13px;color:var(--muted)}
.stop .meta b{color:var(--ink);font-weight:600}
.actions{display:flex;gap:10px;margin-top:40px;flex-wrap:wrap}
.thinking{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.train{width:60px;height:2px;background:var(--line);position:relative;overflow:hidden}
.train::after{content:"";position:absolute;inset:0;width:20px;background:var(--jewel);animation:ride 1.1s ease-in-out infinite}
@keyframes ride{from{transform:translateX(-20px)}to{transform:translateX(60px)}}
.error{border:1px solid var(--line);border-radius:10px;padding:20px}

/* landing: night sky and its inverse */
.split{display:grid;grid-template-columns:1fr;width:100vw;margin-left:calc(50% - 50vw)}
.pick{position:relative;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;min-height:calc(50svh - 36px);padding:32px max(20px,calc(50vw - 300px));
  border:0;text-align:left;font:inherit;cursor:pointer}
.pick.night{background:#271A47;color:#DBC9FF;--dot:#FF9AD5}
.pick.day{background:#DBC9FF;color:#271A47;--dot:#7FFEB1}
.pick b{font-family:var(--serif);font-weight:400;font-size:clamp(3.4rem,16vw,7.5rem);line-height:1;letter-spacing:0;display:block}
.pick b .last{white-space:nowrap}
@media (max-width:759px){.pick.day{order:-1}}
.pick b .last::after{content:"";display:inline-block;vertical-align:middle;margin-inline-start:.22em;width:.14em;height:.14em;border-radius:50%;background:var(--dot);transition:transform .25s}
.pick > span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.111em;max-width:40ch;line-height:1.7}
.pick.night > span{color:#BC994E}
.pick:focus-visible{outline:1px solid currentColor;outline-offset:-10px}
@media (min-width:760px){.split{grid-template-columns:1fr 1fr}.pick{min-height:calc(100svh - 62px);padding:48px}.pick b{font-size:clamp(3.4rem,8.5vw,7.5rem)}}

/* city list: journal rows */
/* home: hero in the top third, continents + cities fill the rest, no rules */
#home .hero{min-height:28svh;display:flex;flex-direction:column;justify-content:flex-end;padding:28px 0 18px}
#home .hero h1{font-size:clamp(2.4rem,10vw,4.4rem);margin:0 0 12px}
#home .hero p{font-size:15px}
.world{--rows:11;--rowh:max(44px,calc((100svh - 28svh - 62px - 64px) / var(--rows)));padding-bottom:24px}
.conts{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 8px;padding:4px 20px 8px}
.conts::-webkit-scrollbar{display:none}
.cont{flex:none;background:none;border:0;border-radius:30px;padding:7px 14px;color:var(--muted);font:inherit;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.111em;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.cont:hover{color:var(--accent)}
.cont[aria-selected="true"]{background:var(--accent);color:var(--bg)}
.cont:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.cities{list-style:none;margin:0 -20px;padding:0;height:calc(var(--rowh) * var(--rows))}
.city{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:var(--rowh);padding:0 20px;border:0;

.city:focus-visible{outline:none}

.city-time{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.111em;white-space:nowrap}
.city-time .night{width:7px;height:7px;border-radius:50%;background:var(--jewel)}
.city:hover .city-time .night,.city:focus-visible .city-time .night{background:currentColor}
.city-time .day{width:7px;height:7px;border-radius:50%;border:1px solid currentColor}

[hidden]{display:none!important}
.friend-row{grid-template-columns:1fr!important}

function fmtTime(v){
  const m=/^(\d{1,2})[:h](\d{2})/.exec(String(v??"")); if(!m) return String(v??"");
  const h=+m[1]%24, mm=m[2];
  if(lang==="en") return `${h%12||12}:${mm} ${h<12?"AM":"PM"}`;
  return `${String(h).padStart(2,"0")}:${mm}`;
}

}

// budget circles: euros stay 5/20/50/100/150, dollars start at 5 and end in 0 or 5, every other currency ends in 0
function roundy(v){
  const e=Math.pow(10,Math.floor(Math.log10(v)));
  let best=e; for(const m of [1,1.5,2,2.5,3,4,5,6,7,8,9,10]){ if(Math.abs(m*e-v)<Math.abs(best-v)) best=m*e; }
  if(Math.round(best/e)===9) best=10*e;   // 90 reads better as 100
  return Math.round(best);
}
// budget circles: euros stay 5/20/50/100/150; everything else is one digit followed by zeros (or 15/25 style), dollars start at 5, others at 10 minimum
// budget circles per currency: only 5, 10, 20, 25, 50, 75, 100, 150, 250, 500 (with extra zeros for big currencies)
const BUDGETS={EUR:[5,20,50,100,150],USD:[5,25,50,100,150],GBP:[5,20,50,75,150],CAD:[10,25,75,150,250],MXN:[100,500,1000,2000,2500],
  BRL:[25,150,250,750,1000],JPY:[1000,2500,7500,15000,25000],KRW:[10000,25000,75000,150000,250000],THB:[200,750,2000,5000,7500],
  SGD:[10,25,75,150,200],BHD:[2,10,20,40,60],SAR:[20,50,100,250,500],CZK:[100,500,1000,2500,5000],TRY:[250,1000,2500,5000,7500],AED:[20,50,100,250,500],MAD:[50,200,500,1000,1500],EGP:[250,1000,2500,5000,7500],
  ZAR:[100,500,1000,2000,2500],AUD:[10,25,100,200,250]};
function budgetIn(j,code){
  if(BUDGETS[code]) return BUDGETS[code][j];
  return Math.max(10,roundy(LEVELS[j]*RATES[code]));
}
const levelLocal=j=>j==null?null:budgetIn(j,localCode());
const levelIn=(j,code)=>budgetIn(j,code);
const compact=n=>n>=1000?(Math.round(n/100)/10).toString().replace(/\.0$/,"")+"k":String(n);
const levelLabel=j=>compact(levelIn(j,dispCode()))+(j===LEVELS.length-1?"+":"");
function fmtCode(n,code){ if(code===localCode()) return fmt(n); if(code==="EUR") return n+" €"; if(code==="USD") return "$"+n; return n+" "+SYM[code]; }
function money(localAmount){
  const n=Number(localAmount); if(!Number.isFinite(n)) return String(localAmount??"");
  const code=dispCode(); if(code===localCode()) return fmt(n);
  const v=n/RATES[localCode()]*RATES[code];
  return "≈ "+fmtCode(v<10?Math.round(v*10)/10:v<100?Math.round(v):nice(v),code);
}
function levelMoney(j){ if(j==null) return "—"; return fmtCode(compact(levelIn(j,dispCode())),dispCode())+(j===LEVELS.length-1?"+":""); }

  const home=inParis(+p.retour_lat,+p.retour_lng)?{x:X(+p.retour_lng),y:Y(+p.retour_lat)}:null;
  if(!pts.length){ box.style.display="none"; return; }
  let vx=0,vy=0,vw=W,vh=H;
  if(zoom){
    const all=pts.concat(home?[home]:[]);
    const xs=all.map(a=>a.x), ys=all.map(a=>a.y);
    const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
    vw=Math.max(260,(Math.max(...xs)-Math.min(...xs))*1.6, (Math.max(...ys)-Math.min(...ys))*1.6*W/H);
    vh=vw*H/W; vx=Math.min(Math.max(cx-vw/2,0),W-vw); vy=Math.min(Math.max(cy-vh/2,0),H-vh);
  }
  const k=vw/W;
  const route=pts.map((a,i)=>(i?"L":"M")+a.x.toFixed(1)+" "+a.y.toFixed(1)).join(" ")+(home?" L"+home.x.toFixed(1)+" "+home.y.toFixed(1):"");
  const labels=HOODS.map(([n,lng,lat])=>`<text x="${X(lng).toFixed(1)}" y="${Y(lat).toFixed(1)}" text-anchor="middle" font-size="${(vw*0.021).toFixed(1)}" fill="var(--muted)" opacity=".85">${n}</text>`).join("");
  const r=vw*0.026;
  const stops=pts.map(a=>`<g class="pin" style="--i:${a.n-1}"><title>${esc(a.n+". "+a.s.lieu)}</title><circle cx="${a.x}" cy="${a.y}" r="${r}" fill="var(--bg)" stroke="var(--metro)" stroke-width="${r*0.38}"/><text x="${a.x}" y="${a.y}" dy=".35em" text-anchor="middle" font-size="${r*1.05}" font-weight="700" fill="var(--ink)" font-family="Inter,sans-serif">${a.n}</text></g>`).join("");
  const homeMk=home?`<g><title>${esc(t("returnLabel")+" : "+(p.retour_station||""))}</title><rect x="${home.x-r*0.8}" y="${home.y-r*0.8}" width="${r*1.6}" height="${r*1.6}" rx="${r*0.35}" fill="var(--lamp)"/><text x="${home.x}" y="${home.y}" dy=".35em" text-anchor="middle" font-size="${r*1.05}" font-weight="700" fill="#000" font-family="Inter,sans-serif">M</text></g>`:"";
  box.innerHTML=`<svg viewBox="${vx.toFixed(1)} ${vy.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}" role="img" aria-label="${t("mapAria")}">
    <rect x="0" y="0" width="${W}" height="${H}" fill="var(--ash)"/>
    <path d="${path(PERIPH)} Z" fill="var(--bg)" stroke="var(--line)" stroke-width="${3*k}"/>
    <path d="${path(SEINE)}" fill="none" stroke="var(--stone)" stroke-opacity=".45" stroke-width="${16*k}" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path(CANAL)}" fill="none" stroke="var(--stone)" stroke-opacity=".35" stroke-width="${5*k}" stroke-linecap="round" stroke-linejoin="round"/>
    ${labels}
    <path class="rline" d="${route}" fill="none" stroke="var(--metro)" stroke-width="${(vw*0.011).toFixed(1)}" stroke-linecap="round" stroke-linejoin="round" ${home?"":""}/>
    ${homeMk}${stops}
  </svg>
  <div class="cap"><span>${t("svgCap")}</span><button type="button" id="mapToggle">${zoom?t("svgAll"):t("svgZoom")}</button></div>`;
  $("#mapToggle").onclick=()=>drawSvgMap(p,!zoom);
}

/* Google Maps (falls back to the drawn map if Google can't load) */
let gmPromise=null, gmFailed=false;
window.gm_authFailure=()=>{ gmFailed=true; if(lastPlan) fallbackMap(lastPlan); };
function loadGoogleMaps(){
  if(window.google?.maps?.importLibrary) return Promise.resolve();
  return gmPromise ||= new Promise((res,rej)=>{
    window.__gmReady=res;
    const s=document.createElement("script");
    s.src=`https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&v=weekly&loading=async&language=${lang}&callback=__gmReady`;
    s.async=true; s.onerror=rej; document.head.appendChild(s);
    setTimeout(()=>rej(new Error("timeout")),10000);
  });
}
function mapStyle(dark){
  const c=dark?{geo:"#271A47",road:"#3E2F66",water:"#000000",txt:"#B7A6DE",halo:"#271A47",rail:"#5A4B80"}
              :{geo:"#E6D9FF",road:"#F4EEFF",water:"#C2ABF2",txt:"#4A3B70",halo:"#E6D9FF",rail:"#B5A0E6"};
  return [
    {elementType:"geometry",stylers:[{color:c.geo}]},
    {elementType:"labels.icon",stylers:[{visibility:"off"}]},
    {elementType:"labels.text.fill",stylers:[{color:c.txt}]},
    {elementType:"labels.text.stroke",stylers:[{color:c.halo}]},
    {featureType:"poi",stylers:[{visibility:"off"}]},
    {featureType:"road",elementType:"geometry",stylers:[{color:c.road}]},
    {featureType:"road.local",elementType:"labels",stylers:[{visibility:"off"}]},
    {featureType:"transit.line",elementType:"geometry",stylers:[{color:c.rail}]},
    {featureType:"transit.station.rail",elementType:"labels.icon",stylers:[{visibility:"on"},{saturation:-100}]},
    {featureType:"water",elementType:"geometry",stylers:[{color:c.water}]}
  ];
}
function directionsUrl(p, pts){
  const ll=s=>`${(+s.lat).toFixed(5)},${(+s.lng).toFixed(5)}`;
  const home=inCity(+p.retour_lat,+p.retour_lng)?{lat:p.retour_lat,lng:p.retour_lng}:null;
  const seq=pts.concat(home?[home]:[]);
  const q=new URLSearchParams({api:"1",origin:ll(seq[0]),destination:ll(seq[seq.length-1]),travelmode:"walking"});
  if(seq.length>2) q.set("waypoints",seq.slice(1,-1).map(ll).join("|"));
  return "https://www.google.com/maps/dir/?"+q.toString();
}
async function drawMap(p){
  const box=$("#map"); if(!box) return;
  const pts=(p.etapes||[]).filter(s=>inCity(+s.lat,+s.lng));
  if(!pts.length){ box.style.display="none"; return; }
  if(!GMAPS_KEY || gmFailed){ fallbackMap(p); return; }
  box.innerHTML=`<div class="gmap" id="gmap" role="region" aria-label="${t("mapAria")}"></div>
    <div class="cap"><span>${t("mapCheck")}</span><a href="${directionsUrl(p,pts)}" target="_blank" rel="noopener">${t("mapOpen")}</a></div>`;
  try{
    await loadGoogleMaps();
    const {Map,Polyline,InfoWindow}=await google.maps.importLibrary("maps");
    const {Marker}=await google.maps.importLibrary("marker");
    const {LatLngBounds}=await google.maps.importLibrary("core");
    if(gmFailed || lastPlan!==p) return;
    const css=getComputedStyle(box), bg=css.getPropertyValue("--bg").trim(), ink=css.getPropertyValue("--ink").trim();
    const dark=bg.toUpperCase()==="#271A47";
    const map=new Map($("#gmap"),{styles:mapStyle(dark),disableDefaultUI:true,zoomControl:true,gestureHandling:"cooperative",clickableIcons:false,backgroundColor:bg});
    const info=new InfoWindow(), bounds=new LatLngBounds();
    const route=[];
    pts.forEach((s,i)=>{
      const pos={lat:+s.lat,lng:+s.lng}; route.push(pos); bounds.extend(pos);
      const m=new Marker({map:calm()?map:null,position:pos,title:`${i+1}. ${s.lieu}`,zIndex:10+i,
        label:{text:String(i+1),color:ink,fontWeight:"700",fontFamily:"Inter, sans-serif",fontSize:"13px"},
        icon:{path:google.maps.SymbolPath.CIRCLE,scale:13,fillColor:bg,fillOpacity:1,strokeColor:ink,strokeWeight:4}});
      if(!calm()) setTimeout(()=>{ m.setAnimation(google.maps.Animation.DROP); m.setMap(map); },300+i*280);
      m.addListener("click",()=>{ info.setContent(`<div style="font:14px Inter,sans-serif;color:#000"><b>${esc(fmtTime(s.heure))} ${esc(s.lieu)}</b><br>${esc(s.quartier)}</div>`); info.open({map,anchor:m}); });
    });
    if(inCity(+p.retour_lat,+p.retour_lng)){
      const pos={lat:+p.retour_lat,lng:+p.retour_lng}; route.push(pos); bounds.extend(pos);
      new Marker({map,position:pos,title:t("returnLabel")+" : "+(p.retour_station||""),zIndex:5,
        label:{text:"M",color:"#000",fontWeight:"700",fontFamily:"Inter, sans-serif",fontSize:"13px"},
        icon:{path:"M -1 -1 L 1 -1 L 1 1 L -1 1 Z",scale:12,fillColor:getComputedStyle(document.documentElement).getPropertyValue("--lamp").trim()||"#7FFEB1",fillOpacity:1,strokeWeight:0}});
    }
    const line=new Polyline({map,path:calm()?route:[],strokeColor:ink,strokeOpacity:1,strokeWeight:4,zIndex:1});
    if(!calm() && route.length>1){
      const seg=520, total=(route.length-1)*seg; let t0=null;
      const step=ts=>{ if(t0===null) t0=ts; const el=Math.min(total,ts-t0), k=Math.floor(el/seg), f=(el%seg)/seg;
        const pts=route.slice(0,k+1);
        if(k<route.length-1){ const a=route[k], b=route[k+1]; pts.push({lat:a.lat+(b.lat-a.lat)*f,lng:a.lng+(b.lng-a.lng)*f}); }
        line.setPath(pts); if(el<total) requestAnimationFrame(step); };
      setTimeout(()=>requestAnimationFrame(step),300);
    }
    if(route.length>1) map.fitBounds(bounds,48); else { map.setCenter(route[0]); map.setZoom(16); }
    google.maps.event.addListenerOnce(map,"idle",()=>{ if(map.getZoom()>17) map.setZoom(17); });
  }catch(e){ gmFailed=true; fallbackMap(p); }
}

const mins=v=>{ const [h,m]=v.split(":").map(Number); return h*60+m; };
// every step still missing; one left gets a precise message, several get a short general one
function missingKeys(){
  const out=[];
  if(friends.some(f=>!String(f.nick||"").trim())) out.push("needNames");
  if(friends.some(f=>f.level==null)) out.push("needBudgets");
  if(!friends.some(f=>f.vibe)) out.push("needVibe");
  if(!$("#area").value) out.push("needArea");
  if($("#end").value && !$("#start").value) out.push("needStart");
  if(!stops) out.push("needStopsMsg");
  const st=$("#start").value, en=$("#end").value;
  if(en && st){ let e=mins(en); if(mode==="night" && e<=6*60) e+=24*60; if(e<=mins(st)) out.push("needEndAfter"); }
  return out;
}
function missingKey(){ const m=missingKeys(); return m.length>1?"needSeveral":(m[0]||null); }
$("#go").onclick=()=>{
  if(friends.length<1){ warnStatus(t("needTwo")); return; }
  const miss=missingKey(); if(miss){ warnStatus(t(miss)); return; }
  if($("#status").classList.contains("err")) plainStatus(t("status"));
  plan(false);
};

const CONTS=[["europe","contEurope"],["north-america","contNA"],["south-america","contSA"],["asia","contAsia"],["africa","contAfrica"],["oceania","contOceania"]];
let cont=(()=>{ const z=(Intl.DateTimeFormat().resolvedOptions().timeZone||"");
  if(/^America\/(Argentina|Sao_Paulo|Bogota|Lima|Santiago|Caracas|Montevideo|La_Paz|Asuncion|Guayaquil|Belem|Fortaleza|Recife|Manaus|Bahia)/.test(z)) return "south-america";
  if(z.startsWith("America/")) return "north-america";
  if(z.startsWith("Asia/")) return "asia";
  if(z.startsWith("Africa/")) return "africa";
  if(z.startsWith("Australia/")||z.startsWith("Pacific/")) return "oceania";
  return "europe"; })();
$("#conts").addEventListener("click",e=>{const b=e.target.closest("[data-cont]"); if(!b) return; cont=b.dataset.cont; renderCities(true); $(`[data-cont="${cont}"]`)?.focus({preventScroll:true});});
$("#conts").addEventListener("keydown",e=>{ if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft") return;
  const i=CONTS.findIndex(c=>c[0]===cont), n=(i+(e.key==="ArrowRight"?1:-1)+CONTS.length)%CONTS.length;
  cont=CONTS[n][0]; renderCities(true); $(`[data-cont="${cont}"]`).focus({preventScroll:true}); e.preventDefault(); });
$("#suggestOpen").onclick=()=>{ const f=$("#suggestForm"), open=f.hidden; f.hidden=!open; $("#suggestOpen").setAttribute("aria-expanded",String(open)); if(open){ $("#sgCity").placeholder=t("sgPh"); $("#sgCity").focus({preventScroll:true}); } };
async function sendSuggest(){
  const city=$("#sgCity").value.trim(); if(city.length<2) return;
  $("#sgSend").disabled=true;
  try{ await fetch("/api/suggest",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({city,mode,lang,tz:Intl.DateTimeFormat().resolvedOptions().timeZone||""})}); }catch{}
  $("#sgSend").disabled=false; $("#sgCity").value=""; $("#suggestForm").hidden=true; $("#suggestOpen").setAttribute("aria-expanded","false");
  $("#sgNote").textContent=t("sgThanks"); setTimeout(()=>$("#sgNote").textContent="",4000);
}
$("#sgSend").onclick=sendSuggest;
$("#sgCity").addEventListener("keydown",e=>{ if(e.key==="Enter") sendSuggest(); });
function renderCities(anim){
  $("#conts").innerHTML=CONTS.map(([id,k])=>`<button class="cont" type="button" role="tab" data-cont="${id}" aria-selected="${id===cont}" tabindex="${id===cont?0:-1}">${t(k)}</button>`).join("");
  const tab=$(`[data-cont="${cont}"]`), row=$("#conts");
  if(tab){ const l=tab.offsetLeft-row.offsetLeft, r=l+tab.offsetWidth; if(l<row.scrollLeft) row.scrollLeft=l-20; else if(r>row.scrollLeft+row.clientWidth) row.scrollLeft=r-row.clientWidth+20; }
  $("#cities").setAttribute("aria-label",t("citiesLabel"));
  const now=new Date(), utc=new Date(now.toLocaleString("en-US",{timeZone:"UTC"}));
  const off=c=>new Date(now.toLocaleString("en-US",{timeZone:c.tz}))-utc;
  const list=$("#cities"); list.classList.remove("in"); if(anim){ void list.offsetWidth; list.classList.add("in"); }
  list.innerHTML=CITIES.filter(c=>c.cont===cont).sort((a,b)=>off(a)-off(b)).map((c,ci)=>{const k=cityClock(c);
    return `<li style="--i:${ci}"><button class="city" type="button" data-city="${c.id}">
      <span class="city-name">${cityName(c)}</span>
      <span class="city-time" aria-label="${t("clockAria",{t:k.txt,c:cityName(c)})}${k.night?t("evening"):""}"><span class="${k.night?"night":"day"}" aria-hidden="true"></span><bdi>${k.txt}</bdi></span>
    </button></li>`;}).join("");
}
$("#timeToggle").onclick=()=>{ const open=$("#timeBox").hidden; setTimeBox(open); if(outing) syncSettings(); };
$("#cities").addEventListener("click",e=>{const b=e.target.closest("[data-city]"); if(!b) return; if(hostingPick){ createOuting(CITIES.find(c=>c.id===b.dataset.city)); return; } go(mode+"/"+b.dataset.city);});
document.querySelector(".split").addEventListener("click",e=>{
  const b=e.target.closest("[data-pick]"); if(!b) return;
  if(calm()){ go(b.dataset.pick); return; }
  const w=document.createElement("div"); w.className="wipe";
  w.style.background=b.dataset.pick==="night"?"#271A47":"#DBC9FF";
  const x=e.clientX||innerWidth/2, y=e.clientY||innerHeight/2;
  w.style.setProperty("--x",x+"px"); w.style.setProperty("--y",y+"px");
  document.body.appendChild(w); void w.offsetWidth; w.classList.add("open");
  setTimeout(()=>{ go(b.dataset.pick); requestAnimationFrame(()=>{ w.classList.add("done"); setTimeout(()=>w.remove(),350); }); },560);
});
function go(path){ const url="/"+path; if(location.pathname!==url) history.pushState(null,"",url); route(); }

function applyMode(){
  const m=M(), root=document.documentElement;
  root.dataset.theme=m.theme; root.dataset.mode=mode;
  $("#homeTitle").innerHTML=hostingPick?esc(t("hostTitle")):t(m.homeTitle); $("#homeText").textContent="";
  $("#s-title").textContent=t(m.panel); $("#go").textContent=t(m.cta);
}
function cityTexts(){
  const c=city;
  $("#metroLabel").textContent=t(mode==="day"?"rideDay":c.ride);
  $("#heroText").textContent="";
  $("#cityTag").textContent=cityName(c);
  plainStatus(t("status"));
}
function setStops(n){ stops=n; if(n) $("#stops").removeAttribute("aria-invalid"); document.querySelectorAll("#stops button").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.n===n))); }
$("#stops").addEventListener("click",e=>{const b=e.target.closest("[data-n]"); if(b&&!b.disabled){ setStops(+b.dataset.n); if(outing) syncSettings(); }});
function openCity(c){
  outing=null; me={}; planShown=""; editingForm=false; setCollapsed(false);
  ["#area","#start","#end","#metro","#day"].forEach(sel=>$(sel).disabled=false);
  document.querySelectorAll("#stops button").forEach(b=>b.disabled=false);
  $("#sharePanel").hidden=true; $("#joinPanel").hidden=true; $("#groupHint").hidden=false; $("#planner").classList.remove("loading");
  delete $("#area").dataset.city; $("#timeToggle").hidden=false;
  setStops(0);
  ctl?.abort(); lastPlan=null;
  city=c; friends=[acct?personRow(acct.me):blankFriend()];
  const m=M();
  $("#area").innerHTML=`<option value="" disabled hidden>${t("choose")}</option>`+c.areas.map(a=>`<option>${esc(a)}</option>`).join(""); $("#area").value="";
  fillTimes(""); fillEnd(""); setTimeBox(false); $("#metro").checked=false; setDay("");
  cityTexts();
  $("#result").innerHTML="";
  renderCurs(); renderFriends();
  if(pendingRedo && pendingRedo.city===c.id && pendingRedo.mode===mode) applyRedo();
}

const TERMS={
fr:`<p>Dernière mise à jour : octobre 2026.</p>

<h2>Offre gratuite et offres payantes</h2><p>Sans compte : 1 plan d'essai. Avec un compte gratuit : 5 plans par jour (remis à zéro à minuit, heure de Paris) et des groupes de vous + 3 amis. Un plan qui échoue n'est pas décompté. Packs : 3 plans pour 0,50 € ou 5 plans pour 1 €, sans date d'expiration. Tournée+ : 7,99 € par mois ou 87,90 € par an, avec 2 mois d'essai gratuit la première fois (une fois par adresse e-mail ; sans résiliation avant la fin de l'essai, l'abonnement démarre automatiquement), plans illimités et groupes jusqu'à vous + 10 amis, résiliable à tout moment depuis « Mon compte » ; l'accès reste actif jusqu'à la fin de la période payée. Prix TTC. Les paiements sont traités par Stripe. En achetant, vous demandez l'accès immédiat au service et reconnaissez perdre votre droit de rétractation pour la partie déjà fournie.</p>
<h2>Liens partenaires</h2><p>Certains boutons de réservation mènent vers des sites partenaires (GetYourGuide, Fever, Ticketmaster). Tournée peut toucher une commission sur les réservations, sans coût supplémentaire pour vous. Vos achats se font chez ces partenaires, selon leurs propres conditions.</p>
<h2>Votre compte</h2><p>Vous êtes responsable des informations que vous saisissez et de la sécurité de votre mot de passe. Vous pouvez supprimer votre compte à tout moment depuis « Mon compte ». Tournée peut suspendre un compte utilisé de façon abusive.</p>
<h2>Âge et alcool</h2><p>Les personnes de moins de 18 ans doivent l'indiquer dans leur profil : les plans de leur groupe ne proposent alors ni alcool ni lieux réservés aux adultes. Respectez l'âge légal et les lois du pays où vous sortez, et consommez avec modération.</p>
<h2>Ce qui est interdit</h2><p>Utiliser Tournée pour harceler, publier des contenus offensants ou illégaux, se faire passer pour quelqu'un d'autre, ou surcharger le service de façon automatisée.</p>
<h2>Avis</h2><p>Les avis sont publiés seulement après validation. Tournée peut refuser ou retirer un avis à tout moment.</p>
<h2>Responsabilité</h2><p>Le service est fourni tel quel, sans garantie de disponibilité permanente. Dans les limites prévues par la loi, Tournée n'est pas responsable des dommages liés à l'utilisation des suggestions.</p>
<h2>Modifications et droit applicable</h2><p>Ces conditions peuvent évoluer ; la date en haut de page indique la dernière version. Elles sont soumises au droit français.</p>`,
en:`<p>Last updated: October 2026.</p>
<h2>The service</h2><p>Tournée helps groups of friends plan an outing based on everyone's budget and vibe. It's free and works without an account. Contact: {email}.</p>
<h2>Suggestions, not guarantees</h2><p>Plans are automatically generated suggestions. Places are checked when possible, but opening hours, prices and availability can change. Always check before you go. Tournée doesn't sell anything directly and isn't responsible for the places, their prices, how they treat you or what happens during the outing.</p>
<h2>Free and paid plans</h2><p>Without an account: 1 free try. With a free account: 5 plans a day (reset at midnight, Paris time) and groups of you + 3 friends. A plan that fails isn't counted. Packs: 3 plans for €0.50 or 5 plans for €1, with no expiry date. Tournée+: €7.99 a month or €87.90 a year, with a 2 month free trial the first time (once per email address; if you don't cancel before the trial ends, the subscription starts automatically), unlimited plans and groups of up to you + 10 friends, cancel anytime from "My account"; access stays on until the end of the paid period. Prices include VAT. Payments are handled by Stripe. By buying, you ask for immediate access to the service and accept that you lose your right of withdrawal for the part already provided.</p>
<h2>Partner links</h2><p>Some booking buttons lead to partner sites (GetYourGuide, Fever, Ticketmaster). Tournée may earn a commission on bookings, at no extra cost to you. Purchases happen on those partners' sites, under their own terms.</p>
<h2>Your account</h2><p>You're responsible for the information you enter and for keeping your password safe. You can delete your account at any time from "My account". Tournée may suspend an account that is misused.</p>
<h2>Age and alcohol</h2><p>People under 18 must say so in their profile: their group's plans then include no alcohol and no adults only places. Respect the legal drinking age and the laws of the country you're in, and drink responsibly.</p>
<h2>Not allowed</h2><p>Using Tournée to harass people, post offensive or illegal content, impersonate someone, or overload the service with automated requests.</p>
<h2>Reviews</h2><p>Reviews are published only after approval. Tournée may refuse or remove a review at any time.</p>
<h2>Liability</h2><p>The service is provided as is, with no guarantee it will always be available. To the extent allowed by law, Tournée isn't liable for any damage linked to using its suggestions.</p>
<h2>Changes and governing law</h2><p>These terms may change; the date at the top shows the latest version. They are governed by French law.</p>`,

fr:`<p>Dernière mise à jour : octobre 2026.</p>
<h2>Qui sommes-nous</h2><p>Tournée est un service indépendant. Contact : {email}.</p>
<h2>Ce que nous collectons</h2>
<p><b>Compte.</b> Si vous vous connectez avec Google, nous gardons un identifiant Google chiffré, votre prénom et votre profil (budget habituel, envies, ce que vous aimez, étudiant, sans alcool, moins de 18 ans, indiqué à côté de votre prénom dans vos groupes), ainsi que votre liste d'amis. Avec Google, nous gardons aussi votre e-mail, mais pas votre photo. Si vous créez un compte avec un e-mail, nous gardons votre prénom, votre nom, votre e-mail et votre mot de passe sous forme chiffrée (jamais en clair).</p>
<p><b>E-mails.</b> Votre e-mail sert uniquement à vous prévenir quand quelqu'un vous invite à une sortie ou vous ajoute en ami, et à réinitialiser votre mot de passe. Rien d'autre, pas de publicité. Ils sont envoyés via Resend.</p>
<p><b>Nom d'utilisateur.</b> Votre @nom d'utilisateur et votre prénom sont visibles par les personnes qui vous recherchent. Une demande d'ami doit être acceptée avant de partager quoi que ce soit.</p>
<p><b>Paiements.</b> Ils sont traités par Stripe : Tournée ne voit et ne garde jamais vos données de carte. Nous gardons seulement votre identifiant client Stripe, l'état de votre abonnement et vos plans en réserve.</p>
<p><b>Plan d'essai.</b> Pour limiter l'essai sans compte à un plan, un identifiant aléatoire est gardé dans votre navigateur et une empreinte chiffrée de cet identifiant est gardée sur notre serveur.</p>
<p><b>Historique.</b> Si vous êtes connecté, vos 50 derniers plans (date, ville, lieux, prénoms du groupe) sont gardés dans « Mon compte », et aussi chez les amis qui faisaient partie du groupe. Vous pouvez les supprimer un par un.</p>
<p><b>Sorties organisées.</b> Les prénoms, budgets et envies saisis dans une sortie partagée, conservés 30 jours.</p>
<p><b>Plans.</b> Pour créer un plan, les informations du groupe (prénoms, budgets, envies, ville, horaires) sont envoyées à nos prestataires techniques. Elles ne sont pas conservées par Tournée.</p>
<p><b>Avis.</b> La note, le texte et le prénom facultatif que vous laissez. Si vous êtes connecté, votre e-mail est joint à l'avis pour que nous puissions vous répondre ; il n'est jamais affiché. Les avis de 4 ou 5 étoiles peuvent être affichés publiquement sur la page d'accueil.</p>
<p><b>Photos des sorties.</b> La photo, la légende et la sortie concernée, visibles seulement par vous et les personnes de votre groupe, supprimées automatiquement après 24 h.</p>
<p><b>Notes des sorties.</b> Si vous notez une sortie, la note, votre commentaire et la sortie concernée sont gardés pour améliorer les plans. Ils ne sont jamais publiés.</p>
<p><b>Partenaires.</b> Le nom du lieu, la ville, l'e-mail et le message envoyés depuis la page « Devenir partenaire », pour vous répondre.</p>
<p><b>Villes demandées.</b> La ville suggérée, la langue et le fuseau horaire.</p>
<p><b>Sur votre appareil.</b> Langue, devise, lieux déjà proposés et session de connexion sont gardés dans le stockage local de votre navigateur. Publicité : Google AdSense peut utiliser des cookies pour afficher et mesurer les annonces, seulement avec votre accord (bannière de consentement). Vous pouvez changer d'avis à tout moment via cette bannière. Nous mesurons la fréquentation de façon anonyme (Vercel Web Analytics et Speed Insights, sans cookies).</p>
<h2>Nos prestataires</h2><p>Vercel (hébergement), Upstash (base de données), Resend (e-mails), Stripe (paiements), Google (connexion, cartes, vérification des lieux et temps de trajet), Anthropic (rédaction des plans), Google AdSense (publicité). Quand vous cliquez sur un lien partenaire (GetYourGuide, Fever, Ticketmaster), ce site peut déposer ses propres cookies et nous verser une commission.</p>
<h2>Durée de conservation</h2><p>Compte : jusqu'à sa suppression. Session de connexion : 60 jours. Sorties organisées : 30 jours. Sorties supprimées de votre historique : 3 jours dans les archives.</p>
<h2>Vos droits</h2><p>Vous pouvez supprimer votre compte à tout moment depuis « Mon compte » : votre profil et vos liens d'amitié sont effacés. Pour toute demande d'accès, de rectification ou de suppression, écrivez à {email}. Vous pouvez aussi contacter la CNIL.</p>`,
en:`<p>Last updated: October 2026.</p>
<h2>Who we are</h2><p>Tournée is an independent service. Contact: {email}.</p>
<h2>What we collect</h2>
<p><b>Account.</b> If you sign in with Google, we keep an encrypted Google identifier, your first name and your profile (usual budget, vibes, what you like, student, no alcohol, under 18, shown next to your name in your groups), plus your friend list. With Google, we also keep your email, but not your photo. If you create an account with an email, we keep your first name, last name, email and your password in hashed form (never in plain text).</p>
<p><b>Emails.</b> Your email is only used to let you know when someone invites you to a party or adds you as a friend, and to reset your password. Nothing else, no ads. They're sent through Resend.</p>
<p><b>Username.</b> Your @username and first name are visible to people who search for you. A friend request has to be accepted before anything is shared.</p>
<p><b>Payments.</b> They're handled by Stripe: Tournée never sees or keeps your card details. We only keep your Stripe customer ID, your subscription status and your saved plans.</p>
<p><b>Free try.</b> To limit the no-account try to one plan, a random ID is kept in your browser and a hashed fingerprint of that ID is kept on our server.</p>
<p><b>History.</b> When you're signed in, your last 50 plans (date, city, places, names in the group) are kept in "My account", and also for friends who were part of the group. You can delete them one by one.</p>
<p><b>Hosted outings.</b> The names, budgets and vibes entered in a shared outing, kept for 30 days.</p>
<p><b>Plans.</b> To build a plan, the group's details (names, budgets, vibes, city, times) are sent to our technical providers. Tournée doesn't keep them.</p>
<p><b>Reviews.</b> The rating, text and optional first name you leave. If you're signed in, your email is attached to the review so we can reply; it's never shown. Reviews with 4 or 5 stars may be shown publicly on the homepage.</p>
<p><b>Outing photos.</b> The photo, caption and outing it belongs to, visible only to you and the people in your group, deleted automatically after 24 hours.</p>
<p><b>Outing ratings.</b> If you rate an outing, the rating, your comment and the outing are kept to improve plans. They're never published.</p>
<p><b>Partners.</b> The place name, city, email and message sent from the "Become a partner" page, so we can reply.</p>
<p><b>City requests.</b> The suggested city, the language and the time zone.</p>
<p><b>On your device.</b> Language, currency, places already suggested and your sign in session are kept in your browser's local storage. Ads: Google AdSense may use cookies to show and measure ads, only with your consent (consent banner). You can change your mind at any time through that banner. We measure visits anonymously (Vercel Web Analytics and Speed Insights, no cookies).</p>
<h2>Our providers</h2><p>Vercel (hosting), Upstash (database), Resend (emails), Stripe (payments), Google (sign in, maps, place checks and travel times), Anthropic (writing the plans), Google AdSense (ads). When you click a partner link (GetYourGuide, Fever, Ticketmaster), that site may set its own cookies and pay us a commission.</p>
<h2>How long we keep data</h2><p>Account: until you delete it. Sign in session: 60 days. Hosted outings: 30 days. Outings deleted from your history: 3 days in the archive.</p>
<h2>Your rights</h2><p>You can delete your account at any time from "My account": your profile and friend links are erased. For any request to access, correct or delete your data, write to {email}.</p>`,
es:`<p>Última actualización: octubre de 2026.</p>
<h2>Quiénes somos</h2><p>Tournée es un servicio independiente. Contacto: {email}.</p>
<h2>Qué recogemos</h2>
<p><b>Correos.</b> Tu correo solo sirve para avisarte cuando alguien te invita a una salida o te añade como amigo, y para restablecer tu contraseña. Nada más, sin publicidad. Se envían a través de Resend.</p>
<p><b>Cuenta.</b> Si inicias sesión con Google, guardamos un identificador de Google cifrado, tu nombre y tu perfil (presupuesto habitual, gustos, lo que te gusta, estudiante, sin alcohol, menor de 18, indicado junto a tu nombre en tus grupos), además de tu lista de amigos. Con Google, también guardamos tu correo, pero no tu foto. Si creas una cuenta con correo, guardamos tu nombre, tu apellido, tu correo y tu contraseña cifrada (nunca en texto claro).</p>
<p><b>Nombre de usuario.</b> Tu @usuario y tu nombre son visibles para quien te busque. Una solicitud de amistad tiene que aceptarse antes de compartir nada.</p>
<p><b>Pagos.</b> Los gestiona Stripe: Tournée nunca ve ni guarda los datos de tu tarjeta. Solo guardamos tu identificador de cliente de Stripe, el estado de tu suscripción y tus planes de reserva.</p>
<p><b>Plan de prueba.</b> Para limitar la prueba sin cuenta a un plan, se guarda un identificador aleatorio en tu navegador y una huella cifrada de ese identificador en nuestro servidor.</p>
<p><b>Historial.</b> Si has iniciado sesión, tus últimos 50 planes (fecha, ciudad, lugares, nombres del grupo) se guardan en "Mi cuenta", y también para los amigos que formaban parte del grupo. Puedes eliminarlos uno a uno.</p>
<p><b>Quedadas organizadas.</b> Los nombres, presupuestos y gustos introducidos en una quedada compartida, guardados 30 días.</p>
<p><b>Planes.</b> Para crear un plan, los datos del grupo (nombres, presupuestos, gustos, ciudad, horarios) se envían a nuestros proveedores técnicos. Tournée no los guarda.</p>
<p><b>Opiniones.</b> La valoración, el texto y el nombre opcional que dejas. Si has iniciado sesión, tu correo se adjunta a la opinión para poder responderte; nunca se muestra. Las opiniones de 4 o 5 estrellas pueden mostrarse públicamente en la página de inicio.</p>
<p><b>Fotos de las salidas.</b> La foto, el pie de foto y la salida a la que pertenece, visibles solo para ti y tu grupo, que se borran automáticamente a las 24 h.</p>
<p><b>Valoraciones de salidas.</b> Si valoras una salida, la nota, tu comentario y la salida se guardan para mejorar los planes. Nunca se publican.</p>
<p><b>Colaboradores.</b> El nombre del local, la ciudad, el correo y el mensaje enviados desde la página "Hazte colaborador", para responderte.</p>
<p><b>Ciudades solicitadas.</b> La ciudad sugerida, el idioma y la zona horaria.</p>
<p><b>En tu dispositivo.</b> El idioma, la moneda, los lugares ya propuestos y tu sesión se guardan en el almacenamiento local del navegador. Publicidad: Google AdSense puede usar cookies para mostrar y medir anuncios, solo con tu consentimiento (banner de consentimiento). Puedes cambiar de opinión en cualquier momento desde ese banner. Medimos las visitas de forma anónima (Vercel Web Analytics y Speed Insights, sin cookies).</p>
<h2>Nuestros proveedores</h2><p>Vercel (alojamiento), Upstash (base de datos), Resend (correos), Stripe (pagos), Google (inicio de sesión, mapas, verificación de lugares y tiempos de trayecto), Anthropic (redacción de los planes), Google AdSense (publicidad). Al hacer clic en un enlace de afiliado (GetYourGuide, Fever, Ticketmaster), ese sitio puede usar sus propias cookies y pagarnos una comisión.</p>
<h2>Cuánto tiempo guardamos los datos</h2><p>Cuenta: hasta que la elimines. Sesión: 60 días. Quedadas: 30 días. Salidas eliminadas de tu historial: 3 días en el archivo.</p>
<h2>Tus derechos</h2><p>Puedes eliminar tu cuenta en cualquier momento desde "Mi cuenta": tu perfil y tus amistades se borran. Para cualquier solicitud de acceso, rectificación o eliminación, escribe a {email}.</p>`

["¿Qué es la misión foto?","En un grupo, a cada uno le toca fotografiar una parada, sorteada entre las que no eligió. La foto va en el plan: solo tú y tu grupo la veis, durante 24 h. Puedes guardarla en el móvil."],

async function loadReviews(){

  try{ const d=await fetch("/api/review").then(r=>r.json()); const list=d.reviews||[];
    $("#reviewsStrip").hidden=!list.length;

    // the list is repeated so the loop never shows a gap; the copy is hidden from screen readers
    let base=list.slice(); while(base.length&&base.length<6) base=base.concat(list);
    const tr=$("#rvTrack"); tr.innerHTML=base.map(r=>card(r,false)).join("")+base.map(r=>card(r,true)).join("");
    tr.style.setProperty("--rv-dur",Math.max(25,base.length*7)+"s"); tr.classList.toggle("moving",list.length>0);
  }catch{ $("#reviewsStrip").hidden=true; rvLoaded=false; }
}

    if(n.type==="faccepted"){ const who=(n.from||"?")+(n.handle?` (@${n.handle})`:"");

      return `<li><span>${esc(msg)}</span><span class="np-act"><a href="/o/${esc(n.outing)}" data-go="${esc(n.outing)}" data-nid="${esc(n.nid)}">${t("seeGroup")}</a><button type="button" data-dec="${esc(n.nid)}">${t("dismiss")}</button></span></li>`; }
    if(n.type==="added"){ const msg=t(n.mode==="day"?"addedDay":"addedNight",{n:n.from||"?",c:cn});
      return `<li><span>${esc(msg)}</span><span class="np-act"><button type="button" data-rsvp="${esc(n.outing)}" data-nid="${esc(n.nid)}">${t("rsvpYes")}</button><a href="/o/${esc(n.outing)}" data-go="${esc(n.outing)}" data-nid="${esc(n.nid)}">${t("seeGroup")}</a></span></li>`; }
    if(n.type==="rsvp"){ const msg=t(n.going?"rsvpMsgYes":"rsvpMsgNo",{n:n.from||"?",m:t(n.mode==="day"?"mDay":"mNight"),c:cn});
      return `<li><span><span class="dot ${n.going?"st-in":"st-pending"}" aria-hidden="true" style="display:inline-block;margin-right:8px;vertical-align:middle"></span>${esc(msg)}</span><span class="np-act"><a href="/o/${esc(n.outing)}" data-go="${esc(n.outing)}" data-nid="${esc(n.nid)}">${t("seeGroup")}</a><button type="button" data-dec="${esc(n.nid)}">${t("dismiss")}</button></span></li>`; }
    const msg=t(n.mode==="day"?"invDay":"invNight",{n:n.from,c:cn});
    return `<li><span>${esc(msg)}</span><span class="np-act"><button type="button" data-acc="${esc(n.nid)}">${t("joinBtn")}</button><button type="button" data-dec="${esc(n.nid)}">${t("decline")}</button></span></li>`; });

  const full=acct?.history||[], day=$("#hDate").value;
  const when=e=>e.settings?.date||dayKey(e.at);
  const all=day?full.filter(e=>when(e)===day):full, h=all.slice(0,histShown);
  $("#hDateToggle").hidden=!full.length; if(!full.length) $("#hDateBox").hidden=true; $("#hClear").hidden=!full.length;
  renderArchive();
  if(day&&!all.length){ $("#hList").innerHTML=`<li><span class="hpeople">${t("histNoDay")}</span></li>`; return; }
  const df=new Intl.DateTimeFormat(lang==="en"?"en-US":lang==="es"?"es-ES":"fr-FR",{day:"numeric",month:"short",year:"numeric"});
  $("#hList").innerHTML=h.length?h.map(e=>{ const c=CITIES.find(x=>x.id===e.city);
    return `<li><span class="hmeta">${esc(df.format(e.settings?.date?new Date(e.settings.date+"T12:00:00"):new Date(e.at)))} · ${esc(c?cityName(c):e.city)} · ${esc(t(MODES[e.mode]?.label||"pickNight"))}</span>
      <span class="htitle">${esc(e.title||"")}${e.rating?` <span class="hstars" aria-label="${esc(t("starAria",{n:e.rating.stars}))}">${"★".repeat(e.rating.stars)}</span>`:""}</span>
      <span class="hstops">${e.stops.map(s=>esc(s.lieu)).join(" → ")}</span>
      ${freshPh(e.photos).length?`<span class="hphotos">${freshPh(e.photos).map(p=>`<img data-ph="${esc(p.sid)}" data-oid="${esc(e.id)}" src="${esc(p.url)}" alt="${esc(p.nick+(p.stop?" · "+p.stop:""))}" title="${esc(p.nick+(p.stop?" · "+p.stop:""))}" loading="lazy" onerror="this.remove()">`).join("")}</span>`:""}
      <span class="hpeople">${e.people.map(p=>esc(p.nick)).join(", ")}</span>
      <span class="hact"><button class="remove" type="button" data-redo="${esc(e.id)}">${t("redo")}</button><button class="remove" type="button" data-delh="${esc(e.id)}">${t("del")}</button></span></li>`; }).join("")
    +(all.length>histShown?`<li class="hmore"><button class="suggest-link" type="button" data-hmore>${t(histShown===3?"seeAll":"seeMore")}</button></li>`:"")
    :`<li><span class="hpeople">${t("noHistory")}</span></li>`;

let pendingRedo=null;
function applyRedo(){
  const en=pendingRedo; pendingRedo=null; if(!en) return;
  friends=en.people.slice(0,8).map(p=>{ const prof=p.uid&&acct?(p.uid===acct.me.uid?acct.me:acct.friends.find(f=>f.uid===p.uid)):null; return prof?personRow(prof):{...blankFriend(),nick:p.nick}; });
  if(!friends.length) friends=[blankFriend()];
  if(en.settings.area && [...$("#area").options].some(o=>o.value===en.settings.area)) $("#area").value=en.settings.area;
  if(en.settings.start||en.settings.end){ fillTimes(en.settings.start); fillEnd(en.settings.end); setTimeBox(true); }
  if(en.settings.stops) setStops(en.settings.stops);
  renderFriends();

function squareJpeg(file,size=320){ return new Promise((ok,ko)=>{ const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{ URL.revokeObjectURL(url); const side=Math.min(img.width,img.height), c=document.createElement("canvas"); c.width=c.height=size;
    c.getContext("2d").drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,size,size); ok(c.toDataURL("image/jpeg",.85)); };
  img.onerror=()=>{ URL.revokeObjectURL(url); ko(new Error("img")); }; img.src=url; }); }

// photo picked: shrink it in the browser (max 1080 px, JPEG) before sending
function shrink(file){ return new Promise((ok,ko)=>{ const url=URL.createObjectURL(file), img=new Image();
  img.onload=()=>{ URL.revokeObjectURL(url); let best="";
    for(const [max,q] of [[1080,.82],[960,.75],[800,.7]]){ const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      best=c.toDataURL("image/jpeg",q); if(best.length*0.75<450*1024) break; }
    ok(best); };
  img.onerror=()=>{ URL.revokeObjectURL(url); ko(new Error("img")); }; img.src=url; }); }
// photo missions: each person photographs a stop they didn't pick (same draw for everyone in the group)
function missionsFor(stops,people){
  if(!stops.length||!people.length) return [];
  let h=2166136261; for(const ch of stops.map(s=>s.lieu).join("|")+"#"+people.map(p=>String(p.nick||"")).join("|")){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0; }
  const rnd=()=>{ h=(h+0x6D2B79F5)>>>0; let x=h; x=Math.imul(x^x>>>15,x|1); x^=x+Math.imul(x^x>>>7,x|61); return ((x^x>>>14)>>>0)/4294967296; };
  const norm=s=>String(s||"").trim().toLowerCase(), used=stops.map(()=>0);
  return people.map(p=>{ let ok=stops.map((_,i)=>i).filter(i=>!(stops[i].pour||[]).some(n=>norm(n)===norm(p.nick)));
    if(!ok.length) ok=stops.map((_,i)=>i);
    const low=Math.min(...ok.map(i=>used[i])); ok=ok.filter(i=>used[i]===low);
    const i=ok[Math.floor(rnd()*ok.length)]; used[i]++; return i; });
}
function myMissionIn(entry){ if(!entry||!acct) return null; const ppl=entry.people||[], k=ppl.findIndex(p=>p.uid===acct.me.uid); if(k<0) return null;
  const m=missionsFor(entry.stops||[],ppl)[k]; return m==null?null:(entry.stops[m]?.lieu||null); }

function route(keepScroll){
  const [m0,c0,extra]=location.pathname.split("/").filter(Boolean);
  const isOuting=m0==="o" && !!c0 && !extra;
  const special=(m0==="account"||m0==="privacy"||m0==="terms"||m0==="friends"||m0==="settings"||m0==="faq"||m0==="business") && !c0 ? m0 : (m0==="f" && c0 && !extra ? "friend" : m0==="reset" && /^[a-f0-9]{64}$/.test(c0||"") && !extra ? "reset" : "");
  const valid=!m0 || isOuting || special || (MODES[m0] && (!c0 || CITIES.some(x=>x.id===c0)) && !extra);
  if(!valid){ history.replaceState(null,"","/"); return route(keepScroll); }
  const c=MODES[m0]?CITIES.find(x=>x.id===c0):null;
  const view=special?(special==="privacy"||special==="terms"||special==="friends"||special==="settings"||special==="faq"||special==="business"?special:"account"):isOuting?"planner":!MODES[m0]?"start":c?"planner":"home";
  if(MODES[m0]){ mode=m0; applyMode(); }
  else if(!isOuting && !special){ document.documentElement.dataset.theme="light"; delete document.documentElement.dataset.mode; }
  if(view!=="home") hostingPick=false;
  $("#landing").hidden=view!=="start"; $("#home").hidden=view!=="home"; $("#planner").hidden=view!=="planner";
  $("#accountView").hidden=view!=="account"; $("#privacyView").hidden=view!=="privacy"; $("#termsView").hidden=view!=="terms"; $("#friendsView").hidden=view!=="friends"; $("#settingsView").hidden=view!=="settings"; $("#faqView").hidden=view!=="faq"; $("#bizView").hidden=view!=="business";
  $("#cityTag").hidden=view!=="planner";
  $("#hostBtn").hidden=!(view==="home"||(view==="planner"&&!isOuting));
  $("#go").hidden=view!=="planner"; $("#status").hidden=view!=="planner";
  document.querySelector("footer").hidden=view==="start";
  document.querySelector("header").classList.toggle("noline",view==="start");
  $("#reviewBox").hidden=view==="start"; if(view==="start"){ loadReviews(); if(acct) loadAcct(); } // fresh party list for the home button
  document.getElementById("sky").classList.toggle("on",view!=="start");
  if(isOuting){ const key="o/"+c0; if(key!==opened){ opened=key; loadOuting(c0); } }
  else if(view==="planner"){ const key=mode+"/"+c.id; if(key!==opened){ openCity(c); opened=key; } document.title="Tournée, "+cityName(c); }
  else if(view==="account"){ opened=""; invite=null; $("#acctMsg").textContent="";
    const paid=new URLSearchParams(location.search).get("paid"); if(paid!==null){ history.replaceState(null,"","/account"); if(paid&&paid!=="0"){ $("#acctMsg").textContent=t("paidOk"); setTimeout(()=>{ if(acct) loadAcct(); },2500); } } document.title="Tournée, "+t("account");
    if(special==="reset"){ resetToken=c0; if(acct){ setSession(""); acct=null; updateAcctBtn(); }
      renderAccount(); $("#acctH1").textContent=t("resetTitle"); $("#acctP").textContent="";
      $("#gsiBtn").hidden=true; $("#orLine").hidden=true; $("#loginForm").hidden=true; $("#signupForm").hidden=true; $("#forgotForm").hidden=true; $("#resetForm").hidden=false; $("#pwMsg").textContent=""; $("#rsPw").focus(); }
    else if(special==="friend"){ const code=c0; acctApi({action:"peek",code}).then(d=>{ if(d.error){ $("#acctMsg").textContent=t("inviteBad"); history.replaceState(null,"","/account"); renderAccount(); return; }
      invite=d.nick; if(acct) addFriendCode(code).then(renderAccount); else { keepCode(code); renderAccount(); } }); }
    else { renderAccount(); if(acct&&!refreshingAcct){ refreshingAcct=true; loadAcct().finally(()=>refreshingAcct=false); } } }
  else if(view==="settings"){ opened=""; document.title="Tournée, "+t("setT"); renderSettings(); if(acct&&!refreshingAcct){ refreshingAcct=true; loadAcct().finally(()=>refreshingAcct=false); } }
  else if(view==="friends"){ opened=""; document.title="Tournée, "+t("friendsTab"); renderFriendsPage(); if(acct&&!refreshingAcct){ refreshingAcct=true; loadAcct().finally(()=>refreshingAcct=false); } }
  else if(view==="terms"){ opened=""; $("#termsText").innerHTML=TERMS[lang].replaceAll("{email}",`<a href="mailto:${CONTACT_EMAIL}">${CONTACT_EMAIL}</a>`); document.title="Tournée, "+t("terms"); }
  else if(view==="privacy"){ opened=""; renderPrivacy(); document.title="Tournée, "+t("privacy"); }
  else if(view==="faq"){ opened=""; renderFaq(); document.title="Tournée, "+t("faqTitle"); }
  else if(view==="business"){ opened=""; $("#bzStatus").textContent=""; document.title="Tournée, "+t("bizLink"); }
  else if(view==="home"){ opened=""; outing=null; renderCities(keepScroll!==true); document.title="Tournée, "+t(M().label).toLowerCase(); }
  else { opened=""; outing=null; document.title="Tournée"; }
  if(keepScroll!==true) window.scrollTo(0,0);
}
(function(){ const sky=document.getElementById("sky"); let html="";
  for(let i=0;i<46;i++){ const x=Math.random()*100, y=Math.random()*100, d=(3+Math.random()*4).toFixed(1), w=(Math.random()*5).toFixed(1), z=Math.random()<.2?3:2;
    html+=`<span style="left:${x}%;top:${y}%;width:${z}px;height:${z}px;--d:${d}s;--w:${w}s"></span>`; }
  sky.innerHTML=html; })();
window.addEventListener("popstate",route);
loadAcct();
setInterval(()=>{ if(!$("#home").hidden) renderCities(); },30000);
/* Language */
function applyLang(){
  const root=document.documentElement;
  root.lang=lang; root.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll(".pick b").forEach(el=>{ const w=el.textContent.split(" "), last=w.pop(); el.innerHTML=(w.length?esc(w.join(" "))+" ":"")+`<span class="last">${esc(last)}</span>`; });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
  const sel=$("#lang"); sel.setAttribute("aria-label",t("langLabel"));
  sel.innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}"${k===lang?" selected":""}>${v}</option>`).join("");
}
$("#homeLink").addEventListener("click",e=>{ e.preventDefault(); go(""); });
$("#lang").addEventListener("change",e=>{
  lang=e.target.value; try{localStorage.setItem("tournee-lang",lang)}catch{}
  const keep=$("#start").value, keepEnd=$("#end").value; applyLang(); fillTimes(keep); fillEnd(keepEnd); route(true);
  updateAcctBtn(); if(!$("#accountView").hidden) renderAccount(); if(!$("#reviewForm").hidden) renderStars(); if(!$("#privacyView").hidden) renderPrivacy(); if(!$("#faqView").hidden) renderFaq(); if(!$("#surveyDlg").hidden&&$("#surveyDlg").open){ $("#svLikes").innerHTML=likeChips([...$("#svLikes").querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.like)); renderSurvey(); }
  if(!$("#planner").hidden){ if(outing){ applyOuting(outing,"lang"); } else { cityTexts(); renderFriends(); if(lastPlan) renderPlan(lastPlan,lastIsExample,true); } }
});
applyLang();
route();
